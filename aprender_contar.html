<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
    <title>Jornada dos Números: Especial Giovanna</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Nunito:wght@400;700;800&family=Fredoka+One&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        :root {
            --paper: #fefcf3; --brown: #5d4037; --brown-light: #795548;
            --coral: #f4845f; --turquoise: #4dd0e1; --lavender: #b39ddb; --lime: #aed581;
            --ruled-line: rgba(173, 200, 230, 0.25);
        }

        body.dark-mode {
            --paper: #1a1a2e; --brown: #e0e0e0; --brown-light: #4dd0e1;
            --ruled-line: rgba(255, 255, 255, 0.05);
        }

        body { 
            font-family: 'Nunito', sans-serif; background: var(--paper); color: #333; 
            height: 100vh; height: 100dvh; overflow: hidden; display: flex; flex-direction: column;
            transition: background 0.5s;
        }

        /* TEXTURA LÚDICA */
        body::before { 
            content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none; 
            background: repeating-linear-gradient(0deg, transparent, transparent 31px, var(--ruled-line) 31px, var(--ruled-line) 32px); 
            background-size: 100% 32px; 
        }

        .header { position: relative; z-index: 50; padding: 8px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(0,0,0,0.05); }
        .titulo-header { font-family: 'Patrick Hand', cursive; font-size: 20px; color: var(--brown); }

        .stage { flex: 1; display: flex; flex-direction: column; justify-content: space-evenly; align-items: center; padding: 10px; z-index: 10; }

        .nav-numeros { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; width: 100%; max-width: 420px; }
        
        .btn-num {
            aspect-ratio: 1/1; border-radius: 12px; border: 2px solid var(--brown-light);
            font-family: 'Fredoka One', cursive; font-size: 22px; color: var(--brown);
            background: #fff; cursor: pointer; box-shadow: 0 4px 0 rgba(93, 64, 55, 0.2);
            transition: transform 0.1s;
        }
        body.dark-mode .btn-num { background: #16213e; color: #fff; box-shadow: 0 4px 0 #000; }
        .btn-num.ativo { background: var(--turquoise); color: #fff; transform: translateY(3px); box-shadow: none; }

        .display-container { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; }

        .numero-grande-card {
            background: #fff; border: 4px solid var(--brown-light); border-radius: 20px;
            width: 110px; height: 140px; display: flex; align-items: center; justify-content: center;
            font-family: 'Fredoka One', cursive; font-size: 80px; color: var(--coral);
            box-shadow: 6px 6px 0 rgba(0,0,0,0.1); transform: rotate(-2deg);
        }
        .pulando { animation: pulo 0.3s ease; }
        @keyframes pulo { 0%, 100% { transform: scale(1) rotate(-2deg); } 50% { transform: scale(1.1) rotate(2deg); } }

        .quantidade-box {
            width: 100%; max-width: 500px; min-height: 140px;
            background: rgba(255,255,255,0.4); border: 3px dashed var(--ruled-line);
            border-radius: 20px; padding: 10px; display: flex; flex-wrap: wrap; 
            justify-content: center; align-content: center; gap: 5px;
        }

        .item-adesivo { font-size: clamp(30px, 12vw, 55px); opacity: 0; }
        .aparecer { animation: pop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
        @keyframes pop { 0% { opacity: 0; transform: scale(0); } 100% { opacity: 1; transform: scale(1); } }

        /* CONFETES VARIADOS */
        .confete { 
            position: fixed; z-index: 999; pointer-events: none; 
            animation: queda linear forwards; border-radius: 2px;
        }
        @keyframes queda { 
            0% { transform: translateY(-50px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
        }

        #container-premio { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 1000; flex-direction: column; align-items: center; justify-content: center; }
        .caixa-presente { font-size: 120px; cursor: pointer; animation: balanco 0.6s infinite; }
        @keyframes balanco { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.15) rotate(5deg); } }

        #video-player-modal { display: none; position: fixed; inset: 0; background: #000; z-index: 2000; align-items: center; justify-content: center; flex-direction: column; }
        .video-container { width: 90%; aspect-ratio: 16/9; border: 4px solid white; border-radius: 15px; overflow: hidden; }
        .btn-fechar { margin-top: 20px; padding: 15px 40px; border-radius: 40px; font-family: 'Fredoka One'; background: #fff; cursor: pointer; border: none; font-size: 18px; }
    </style>
</head>
<body class="light-mode">

<header class="header">
    <button class="btn-theme" onclick="toggleTheme()" id="themeIcon" style="background:none; border:none; font-size:24px;">🌙</button>
    <span class="titulo-header">🔢 Números da Giovanna</span>
    <div style="width: 34px;"></div>
</header>

<div class="stage">
    <h2 class="instrucoes" style="font-family:'Patrick Hand'; color:var(--brown); font-size:22px;">Toque nos números! ✨</h2>
    
    <div class="nav-numeros" id="navNumeros"></div>

    <div class="display-container">
        <div class="numero-grande-card" id="numDisplay">?</div>
        <div class="quantidade-box" id="qtdBox"></div>
    </div>
</div>

<div id="container-premio">
    <div class="caixa-presente" onclick="abrirVideo()">🎁</div>
    <div style="color:white; font-family:'Fredoka One'; margin-top:20px; font-size:24px;">UAU! VOCÊ CONSEGUIU! 🏆</div>
</div>

<div id="video-player-modal">
    <div class="video-container" id="playerYouTube"></div>
    <button class="btn-fechar" onclick="fecharVideo()">✖ VOLTAR</button>
</div>

<script>
    const temasNumeros = {
        0: { emoji: "📭", cor: "#9e9e9e" }, 1: { emoji: "🍎", cor: "#f44336" },
        2: { emoji: "🦆", cor: "#03a9f4" }, 3: { emoji: "⭐", cor: "#ffeb3b" },
        4: { emoji: "🐸", cor: "#4caf50" }, 5: { emoji: "🖐️", cor: "#ff9800" },
        6: { emoji: "🐞", cor: "#e91e63" }, 7: { emoji: "✏️", cor: "#795548" },
        8: { emoji: "🦋", cor: "#9c27b0" }, 9: { emoji: "🎈", cor: "#ff5722" },
        10: { emoji: "⚽", cor: "#3f51b5" }
    };

    const videosPremios = ["DhEpqf2tDJw", "mJYQ1zRzqo0", "YlBdVa8QA00"];
    let indiceVideoAtual = 0;
    let contagemEmAndamento = false;
    const navContainer = document.getElementById('navNumeros');
    const numDisplay = document.getElementById('numDisplay');
    const qtdBox = document.getElementById('qtdBox');

    // Gerar Botões
    for (let i = 0; i <= 10; i++) {
        const btn = document.createElement('button');
        btn.className = 'btn-num'; btn.innerText = i;
        btn.onclick = () => selecionarNumero(i, btn);
        navContainer.appendChild(btn);
    }

    function toggleTheme() {
        document.body.classList.toggle('dark-mode');
        document.getElementById('themeIcon').innerText = document.body.classList.contains('dark-mode') ? '☀️' : '🌙';
    }

    async function selecionarNumero(numero, btn) {
        if (contagemEmAndamento) return;
        contagemEmAndamento = true;

        // Reset visual
        document.querySelectorAll('.btn-num').forEach(b => b.classList.remove('ativo'));
        if(btn) btn.classList.add('ativo');
        
        numDisplay.innerText = numero;
        numDisplay.style.color = temasNumeros[numero].cor;
        qtdBox.innerHTML = '';

        // 1. Áudio do Número Principal (Voz da Giovanna)
        await tocarSom(`numero_${numero}.mp3`);

        if (numero === 0) {
            qtdBox.innerHTML = `<p style="font-family:'Patrick Hand'; font-size:24px; color:var(--brown);">Vazio!</p>`;
        } else {
            // 2. Contagem Progressiva
            for (let i = 1; i <= numero; i++) {
                const item = document.createElement('div');
                item.className = 'item-adesivo';
                item.innerText = temasNumeros[numero].emoji;
                qtdBox.appendChild(item);
                
                // Animação e Áudio da contagem (1, 2, 3...)
                numDisplay.classList.add('pulando');
                item.classList.add('aparecer');
                
                // Lançar X confetes para o número X
                lancarConfetes(1, false); 

                await tocarSom(`numero_${i}.mp3`);
                numDisplay.classList.remove('pulando');
                await new Promise(r => setTimeout(r, 100));
            }
        }

        // 3. Grande Final no 10
        if (numero === 10) {
            await tocarSom('aplausos.ogg'); // Som de palmas e festa
            festejarMuito();
            setTimeout(() => { document.getElementById('container-premio').style.display = 'flex'; }, 1500);
        }

        contagemEmAndamento = false;
    }

    function tocarSom(src) {
        return new Promise(res => {
            const audio = new Audio(src);
            audio.onended = res;
            audio.onerror = res;
            audio.play().catch(res);
        });
    }

    function lancarConfetes(quantidade, especial) {
        const cores = ['#ff0', '#f0f', '#0ff', '#f00', '#0f0', '#ff8c00', '#fff'];
        const formatos = ['50%', '0%']; // Círculos e Quadrados

        for (let i = 0; i < quantidade; i++) {
            const c = document.createElement('div');
            c.className = 'confete';
            c.style.left = Math.random() * 100 + 'vw';
            c.style.width = (Math.random() * 8 + 6) + 'px';
            c.style.height = (Math.random() * 12 + 6) + 'px';
            c.style.background = cores[Math.floor(Math.random() * cores.length)];
            c.style.borderRadius = formatos[Math.floor(Math.random() * formatos.length)];
            
            const duracao = especial ? (Math.random() * 3 + 2) : 2;
            c.style.animationDuration = duracao + 's';
            
            document.body.appendChild(c);
            setTimeout(() => c.remove(), duracao * 1000);
        }
    }

    function festejarMuito() {
        // Várias ondas de confetes variados
        let ondas = 0;
        const intervalo = setInterval(() => {
            lancarConfetes(20, true);
            ondas++;
            if(ondas > 5) clearInterval(intervalo);
        }, 300);
    }

    function abrirVideo() {
        const id = videosPremios[indiceVideoAtual];
        document.getElementById('playerYouTube').innerHTML = `<iframe width="100%" height="100%" src="https://www.youtube.com/embed/${id}?autoplay=1" frameborder="0" allow="autoplay" allowfullscreen></iframe>`;
        document.getElementById('video-player-modal').style.display = 'flex';
        document.getElementById('container-premio').style.display = 'none';
        indiceVideoAtual = (indiceVideoAtual + 1) % videosPremios.length;
    }

    function fecharVideo() {
        document.getElementById('video-player-modal').style.display = 'none';
        document.getElementById('playerYouTube').innerHTML = '';
        numDisplay.innerText = "?";
        qtdBox.innerHTML = "";
        document.querySelectorAll('.btn-num').forEach(b => b.classList.remove('ativo'));
    }
</script>
</body>
</html>
