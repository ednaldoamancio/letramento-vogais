<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
    <title>Jornada das Letras: Números e Quantidades</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Nunito:wght@400;600;700;800&family=Fredoka+One&display=swap" rel="stylesheet">
    <style>
        /* DESIGN BASE E VARIÁVEIS */
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        :root {
            --coral: #f4845f; --turquoise: #4dd0e1; --lavender: #b39ddb; --lime: #aed581; --peach: #ffab91;
            --paper: #fefcf3; --brown: #5d4037; --brown-light: #795548;
            --ruled-line: rgba(173, 200, 230, 0.25); --margin-line: rgba(200, 100, 100, 0.2);
            --bg-transition: 0.5s ease;
        }

        body.dark-mode {
            --paper: #1a1a2e;
            --brown: #e0e0e0;
            --brown-light: #4dd0e1;
            --ruled-line: rgba(255, 255, 255, 0.05);
            --margin-line: rgba(77, 208, 225, 0.2);
            color: #fff;
        }

        body { 
            font-family: 'Nunito', sans-serif; 
            background: var(--paper); 
            color: #333; 
            height: 100vh; /* Ocupa a altura toda */
            height: 100dvh; /* Altura dinâmica para mobiles modernos */
            overflow: hidden; /* Remove a rolagem */
            display: flex;
            flex-direction: column;
            transition: background var(--bg-transition), color var(--bg-transition);
        }

        /* TEXTURA DE LINHAS */
        body::before { 
            content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none; 
            background: repeating-linear-gradient(0deg, transparent, transparent 31px, var(--ruled-line) 31px, var(--ruled-line) 32px); 
            background-size: 100% 32px; background-position: 0 16px; 
        }

        /* HEADER COMPACTO */
        .header { 
            position: relative; z-index: 50; 
            background: rgba(254, 252, 243, 0.92); 
            backdrop-filter: blur(12px); 
            border-bottom: 1px solid rgba(180, 200, 220, 0.3);
        }
        body.dark-mode .header { background: rgba(26, 26, 46, 0.92); }
        .header-inner { max-width: 900px; margin: 0 auto; padding: 8px 16px; display: flex; align-items: center; justify-content: space-between; }
        .titulo-header { font-family: 'Patrick Hand', cursive; font-size: clamp(14px, 4vw, 18px); color: var(--brown); }

        .btn-theme { background: none; border: none; font-size: 24px; cursor: pointer; }

        /* CONTEÚDO PRINCIPAL AJUSTÁVEL */
        .stage { 
            flex: 1; /* Ocupa o espaço restante */
            display: flex;
            flex-direction: column;
            justify-content: space-evenly; /* Distribui os itens verticalmente */
            align-items: center;
            padding: 10px;
            z-index: 10;
            width: 100%;
        }

        .instrucoes { font-family: 'Patrick Hand', cursive; font-size: clamp(18px, 5vw, 26px); color: var(--brown); }

        .nav-numeros { 
            display: grid; 
            grid-template-columns: repeat(6, 1fr); 
            gap: 8px; 
            width: 100%; 
            max-width: 400px; 
        }
        
        .btn-num {
            aspect-ratio: 1/1;
            border-radius: 12px; border: 2px solid var(--brown-light);
            font-family: 'Fredoka One', cursive; font-size: 20px; color: var(--brown);
            background: #fff; cursor: pointer; 
            box-shadow: 0 4px 0 rgba(93, 64, 55, 0.2);
        }
        body.dark-mode .btn-num { background: #16213e; color: #fff; box-shadow: 0 4px 0 #000; }
        .btn-num.ativo { background: var(--turquoise); color: #fff; transform: translateY(2px); box-shadow: none; }

        /* DISPLAY CENTRAL */
        .display-container { 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
            align-items: center; 
            width: 100%;
            flex: 1;
            justify-content: center;
        }

        .numero-grande-card {
            background: #fff; border: 4px solid var(--brown-light); border-radius: 20px;
            width: 100px; height: 130px; display: flex; align-items: center; justify-content: center;
            font-family: 'Fredoka One', cursive; font-size: 70px; color: var(--coral);
            box-shadow: 6px 6px 0 rgba(93, 64, 55, 0.1); transform: rotate(-2deg);
        }
        body.dark-mode .numero-grande-card { background: #16213e; }

        .quantidade-box {
            width: 100%; max-width: 450px; min-height: 120px;
            background: rgba(255,255,255,0.6);
            border: 3px dashed var(--ruled-line); border-radius: 20px; padding: 10px;
            display: flex; flex-wrap: wrap; justify-content: center; align-content: center; gap: 8px;
        }
        body.dark-mode .quantidade-box { background: rgba(22, 33, 62, 0.6); }

        .item-adesivo { font-size: clamp(35px, 10vw, 55px); opacity: 0; transform: scale(0.3); }
        .aparecer { animation: popInEmoji 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
        
        @keyframes popInEmoji { 
            0% { opacity: 0; transform: scale(0.3) rotate(-15deg); }
            100% { opacity: 1; transform: scale(1) rotate(0deg); }
        }

        /* MODAIS E PRÊMIOS */
        #container-premio { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 1000; flex-direction: column; align-items: center; justify-content: center; }
        .caixa-presente { font-size: 100px; cursor: pointer; animation: balanco 0.8s infinite ease-in-out; }
        
        @keyframes balanco { 0%, 100% { transform: rotate(-8deg); } 50% { transform: rotate(8deg) scale(1.1); } }
        
        .confete { position: fixed; top: -20px; width: 10px; height: 10px; z-index: 999; pointer-events: none; animation: queda linear forwards; }
        @keyframes queda { to { transform: translateY(110vh) rotate(720deg); } }

        #video-player-modal { display: none; position: fixed; inset: 0; background: #000; z-index: 2000; align-items: center; justify-content: center; flex-direction: column; }
        .video-container { width: 90%; aspect-ratio: 16/9; border: 5px solid white; border-radius: 15px; overflow: hidden; }
        .btn-fechar { margin-top: 20px; padding: 12px 30px; border-radius: 30px; border: none; font-family: 'Fredoka One'; background: #fff; cursor: pointer; }
    </style>
</head>
<body>

<header class="header">
    <div class="header-inner">
        <button class="btn-theme" onclick="toggleTheme()" id="themeIcon">🌙</button>
        <span class="titulo-header">🔢 Brincando com a Giovanna</span>
        <div style="width: 34px;"></div>
    </div>
</header>

<div class="stage">
    <h2 class="instrucoes">Toque em um número! 🎈</h2>
    
    <div class="nav-numeros" id="navNumeros"></div>

    <div class="display-container">
        <div class="numero-grande-card" id="numDisplay">?</div>
        <div class="quantidade-box" id="qtdBox">
            <p style="font-family: 'Patrick Hand'; font-size: 18px; opacity: 0.7;">Os desenhos vão aparecer aqui!</p>
        </div>
    </div>
</div>

<div id="container-premio">
    <div class="caixa-presente" onclick="abrirVideo()">🎁</div>
    <div style="color: white; font-family: 'Fredoka One'; margin-top: 20px; font-size: 24px;">ABRA SEU PRESENTE!</div>
</div>

<div id="video-player-modal">
    <div class="video-container" id="playerYouTube"></div>
    <button class="btn-fechar" onclick="fecharVideo()">✖ VOLTAR</button>
</div>

<script>
    const temasNumeros = {
        0: { emoji: "📭", cor: "#9e9e9e" }, 1: { emoji: "🍎", cor: "var(--coral)" },
        2: { emoji: "🦆", cor: "var(--turquoise)" }, 3: { emoji: "⭐", cor: "var(--lime)" },
        4: { emoji: "🐸", cor: "#4caf50" }, 5: { emoji: "🖐️", cor: "var(--peach)" },
        6: { emoji: "🐞", cor: "#f44336" }, 7: { emoji: "✏️", cor: "#ff9800" },
        8: { emoji: "🦋", cor: "var(--lavender)" }, 9: { emoji: "🎈", cor: "#e91e63" },
        10: { emoji: "⚽", cor: "#3f51b5" }
    };

    const videosPremios = ["DhEpqf2tDJw", "mJYQ1zRzqo0", "YlBdVa8QA00"];
    let indiceVideoAtual = 0;
    const navContainer = document.getElementById('navNumeros');
    const numDisplay = document.getElementById('numDisplay');
    const qtdBox = document.getElementById('qtdBox');
    let contagemEmAndamento = false;

    // Criar botões
    for (let i = 0; i <= 10; i++) {
        const btn = document.createElement('button');
        btn.className = 'btn-num'; btn.innerText = i;
        btn.onclick = () => selecionarNumero(i, btn);
        navContainer.appendChild(btn);
    }

    function toggleTheme() {
        document.body.classList.toggle('dark-mode');
        document.getElementById('themeIcon').innerText = document.body.classList.contains('dark-mode') ? '☀️' : '🌙';
    }

    async function selecionarNumero(numero, btnClicado) {
        if (contagemEmAndamento) return;
        contagemEmAndamento = true;

        document.querySelectorAll('.btn-num').forEach(b => b.classList.remove('ativo'));
        btnClicado.classList.add('ativo');
        
        numDisplay.innerText = numero;
        numDisplay.style.color = temasNumeros[numero].cor;
        qtdBox.innerHTML = '';

        // Efeito Lúdico: Confete pequeno ao tocar
        lancarConfete(10);

        if (numero === 0) {
            qtdBox.innerHTML = `<p style="font-family: 'Patrick Hand'; font-size: 24px;">Vazio! É zero.</p>`;
        } else {
            for (let i = 1; i <= numero; i++) {
                const item = document.createElement('div');
                item.classList.add('item-adesivo');
                item.innerText = temasNumeros[numero].emoji;
                qtdBox.appendChild(item);
                
                // Simulação de som (ou você pode manter sua lógica de Audio real)
                await new Promise(r => {
                    item.classList.add('aparecer');
                    setTimeout(r, 300); 
                });
            }
        }

        if (numero === 10) {
            festejar();
            setTimeout(() => { document.getElementById('container-premio').style.display = 'flex'; }, 1000);
        }
        contagemEmAndamento = false;
    }

    function lancarConfete(qtd) {
        for (let i = 0; i < qtd; i++) {
            const c = document.createElement('div');
            c.className = 'confete';
            c.style.left = Math.random() * 100 + 'vw';
            c.style.backgroundColor = `hsl(${Math.random() * 360}, 100%, 50%)`;
            c.style.animationDuration = (Math.random() * 2 + 2) + 's';
            document.body.appendChild(c);
            setTimeout(() => c.remove(), 3000);
        }
    }

    function festejar() { lancarConfete(100); }

    function abrirVideo() {
        const videoId = videosPremios[indiceVideoAtual];
        document.getElementById('playerYouTube').innerHTML = `<iframe width="100%" height="100%" src="https://www.youtube.com/embed/${videoId}?autoplay=1" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
        document.getElementById('video-player-modal').style.display = 'flex';
        document.getElementById('container-premio').style.display = 'none';
        indiceVideoAtual = (indiceVideoAtual + 1) % videosPremios.length;
    }

    function fecharVideo() {
        document.getElementById('video-player-modal').style.display = 'none';
        document.getElementById('playerYouTube').innerHTML = '';
    }
</script>
</body>
</html>
