<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
    <title>Jornada das Letras: Atividades</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Nunito:wght@400;700;800&family=Fredoka+One&display=swap" rel="stylesheet">
    <style>
        :root {
            --coral: #f4845f; --coral-dark: #e05a3a;
            --turquoise: #4dd0e1; --turquoise-dark: #26a8b8;
            --lavender: #b39ddb; --lavender-dark: #8e79c0;
            --lime: #aed581; --lime-dark: #8bc34a;
            --peach: #ffab91; --peach-dark: #e08060;
            --paper: #fefcf3; --brown: #5d4037;
            --ruled-line: #add8e6; --margin-line: #ff9999;
            --header-bg: rgba(254, 252, 243, 0.92);
        }
        [data-theme="dark"] {
            --paper: #2c3e50; --brown: #ecf0f1;
            --ruled-line: #34495e; --margin-line: #e74c3c;
            --header-bg: rgba(44, 62, 80, 0.92);
        }
        body { font-family: 'Nunito', sans-serif; background: var(--paper); color: var(--brown); min-height: 100vh; overflow-x: hidden; margin:0; transition: background 0.3s; }
        body::before { content: ''; position: fixed; inset: 0; z-index: 0; background: repeating-linear-gradient(0deg, transparent, transparent 30px, var(--ruled-line) 30px, var(--ruled-line) 31px); background-size: 100% 31px; }
        body::after { content: ''; position: fixed; top: 0; bottom: 0; left: clamp(40px, 8vw, 80px); width: 2px; background: var(--margin-line); opacity: 0.6; }

        .header { position: sticky; top: 0; z-index: 50; background: var(--header-bg); border-bottom: 2px solid var(--ruled-line); }
        .header-inner { max-width: 800px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; }
        
        .stage { max-width: 700px; margin: 24px auto; padding: 0 16px; position: relative; z-index: 10; text-align: center; }
        
        /* Video Card */
        .video-card { background: rgba(255,255,255,0.4); border: 3px solid var(--ruled-line); border-radius: 25px; padding: 15px; max-width: 320px; margin: 0 auto 20px; min-height: 280px; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
        .video-player { width: 100%; border-radius: 15px; display: none; }
        .video-player.ativo { display: block; }
        .letra-grande { font-family: 'Fredoka One', cursive; font-size: 140px; display: block; text-shadow: 4px 4px 0 rgba(0,0,0,0.1); }

        /* Blocos de Vogais (Design de Madeira Colorida) */
        .blocos-container { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin-bottom: 25px; }
        .bloco-vogal { 
            width: 60px; height: 60px; border-radius: 12px; border: none; 
            font-family: 'Fredoka One', cursive; font-size: 1.8rem; color: #fff; 
            cursor: pointer; transition: 0.2s; 
        }
        .bloco-A { background: var(--coral); box-shadow: 0 5px var(--coral-dark); }
        .bloco-E { background: var(--turquoise); box-shadow: 0 5px var(--turquoise-dark); }
        .bloco-I { background: var(--lavender); box-shadow: 0 5px var(--lavender-dark); }
        .bloco-O { background: var(--lime); box-shadow: 0 5px var(--lime-dark); }
        .bloco-U { background: var(--peach); box-shadow: 0 5px var(--peach-dark); }
        .bloco-vogal:hover { transform: scale(1.1); }

        /* Jogo de Ligação com Cubinhos */
        .jogo-ligacao { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; max-width: 500px; margin: 30px auto; display: none; }
        .coluna { display: flex; flex-direction: column; gap: 18px; }
        
        .item-jogo { 
            background: white; border: none; border-radius: 15px; 
            cursor: pointer; transition: 0.2s; display: flex; 
            align-items: center; justify-content: center;
            min-height: 100px; width: 100%;
        }

        /* Estilo dos Cubinhos no Jogo */
        .cubo-letra { color: white; font-family: 'Fredoka One', cursive; font-size: 50px; }
        .cubo-figura { border: 4px solid var(--ruled-line); background: #fff; }
        .cubo-figura img { width: 85px; height: 85px; object-fit: contain; }

        .selecionado { transform: scale(1.1) rotate(2deg); outline: 4px solid #ffcc00; z-index: 2; }
        .correto { opacity: 0.5; pointer-events: none; transform: scale(0.9); filter: grayscale(0.5); }

        .btn-acao { padding: 16px 32px; border-radius: 50px; border: none; font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 18px; cursor: pointer; margin-top: 20px; box-shadow: 0 5px #bbb; }
        .btn-iniciar { background: var(--turquoise); color: white; box-shadow: 0 5px var(--turquoise-dark); }
        .btn-proxima { background: #ffcc00; color: #5d4037; display: none; box-shadow: 0 5px #e6b800; }
    </style>
</head>
<body>

<header class="header">
    <div class="header-inner">
        <a href="vogais.html" style="text-decoration:none; color:inherit; font-weight:800;">⬅ VOLTAR</a>
        <button onclick="toggleTheme()" style="background:none; border:none; font-size:22px; cursor:pointer;" id="btnTema">☀️</button>
    </div>
</header>

<div class="stage">
    <h2 id="feedback" style="font-family: 'Patrick Hand'; font-size: 30px;">A mágica das letrinhas!</h2>
    
    <div id="area-apresentacao">
        <div class="video-card">
            <span id="display-letra" class="letra-grande">✨</span>
            <video id="meuVideo" class="video-player" playsinline></video>
        </div>

        <div class="blocos-container">
            <button class="bloco-vogal bloco-A" onclick="tocarVogal('A', 'vogal_a.ogg')">A</button>
            <button class="bloco-vogal bloco-E" onclick="tocarVogal('E', 'vogal_e.ogg')">E</button>
            <button class="bloco-vogal bloco-I" onclick="tocarVogal('I', 'vogal_i.ogg')">I</button>
            <button class="bloco-vogal bloco-O" onclick="tocarVogal('O', 'vogal_o.ogg')">O</button>
            <button class="bloco-vogal bloco-U" onclick="tocarVogal('U', 'vogal_u.ogg')">U</button>
        </div>
        <button class="btn-acao btn-iniciar" id="btnIniciar" onclick="iniciarApresentacao()">▶ Começar Apresentação</button>
    </div>

    <div id="area-jogo" class="jogo-ligacao">
        <div class="coluna">
            <div class="item-jogo cubo-letra bloco-A" onclick="selecionarItem(this, 'letra', 'A', 'vogal_a.ogg')">A</div>
            <div class="item-jogo cubo-letra bloco-I" onclick="selecionarItem(this, 'letra', 'I', 'vogal_i.ogg')">I</div>
            <div class="item-jogo cubo-letra bloco-E" onclick="selecionarItem(this, 'letra', 'E', 'vogal_e.ogg')">E</div>
            <div class="item-jogo cubo-letra bloco-U" onclick="selecionarItem(this, 'letra', 'U', 'vogal_u.ogg')">U</div>
            <div class="item-jogo cubo-letra bloco-O" onclick="selecionarItem(this, 'letra', 'O', 'vogal_o.ogg')">O</div>
        </div>
        <div class="coluna">
            <div class="item-jogo cubo-figura" onclick="selecionarItem(this, 'figura', 'E', 'vogal_e.ogg')"><img src="elefante.png"></div>
            <div class="item-jogo cubo-figura" onclick="selecionarItem(this, 'figura', 'A', 'vogal_a.ogg')"><img src="aviao.png"></div>
            <div class="item-jogo cubo-figura" onclick="selecionarItem(this, 'figura', 'O', 'vogal_o.ogg')"><img src="ovo.png"></div>
            <div class="item-jogo cubo-figura" onclick="selecionarItem(this, 'figura', 'U', 'vogal_u.ogg')"><img src="unicornio.png"></div>
            <div class="item-jogo cubo-figura" onclick="selecionarItem(this, 'figura', 'I', 'vogal_i.ogg')"><img src="iguana.png"></div>
        </div>
    </div>

    <button class="btn-acao btn-proxima" id="btnProxima" onmouseenter="ouvirLetra('proxima_atividade.mp3')" onclick="irParaJogo()">🌟 PRÓXIMA ATIVIDADE</button>
</div>

<script>
    const videos = { A: 'a_de_aviao.mp4', E: 'e_de_elefante.mp4', I: 'i_de_iguana.mp4', O: 'o_de_de_ovo.mp4', U: 'u_de_unicornio.mp4' };
    const coresLetras = { A: '#f4845f', E: '#4dd0e1', I: '#b39ddb', O: '#aed581', U: '#ffab91' };
    let somAtual;

    function tocarSom(arquivo) {
        if(somAtual) somAtual.pause();
        somAtual = new Audio(arquivo);
        somAtual.play();
    }

    // Função para o hover do botão próxima atividade
    function ouvirLetra(arq) {
        let s = new Audio(arq);
        s.play().catch(e => {});
    }

    function tocarVogal(letra, som) {
        const player = document.getElementById('meuVideo');
        const display = document.getElementById('display-letra');
        tocarSom(som);
        display.style.display = 'none';
        player.src = videos[letra];
        player.classList.add('ativo');
        player.play();
        player.onended = () => {
            player.classList.remove('ativo');
            display.innerText = letra;
            display.style.color = coresLetras[letra];
            display.style.display = 'block';
        };
        document.getElementById('btnProxima').style.display = 'inline-block';
    }

    function iniciarApresentacao() {
        const ordem = ['A','E','I','O','U'];
        const sons = ['vogal_a.ogg','vogal_e.ogg','vogal_i.ogg','vogal_o.ogg','vogal_u.ogg'];
        let i = 0;
        document.getElementById('btnIniciar').style.display = 'none';
        function proximo() {
            if(i < ordem.length) {
                tocarVogal(ordem[i], sons[i]);
                document.getElementById('meuVideo').onended = () => {
                    document.getElementById('meuVideo').classList.remove('ativo');
                    document.getElementById('display-letra').innerText = ordem[i];
                    document.getElementById('display-letra').style.color = coresLetras[ordem[i]];
                    document.getElementById('display-letra').style.display = 'block';
                    i++; setTimeout(proximo, 1500);
                };
            }
        }
        proximo();
    }

    // Jogo de Ligação
    let escolhaLetra = null, escolhaFigura = null, acertos = 0;

    function irParaJogo() {
        document.getElementById('area-apresentacao').style.display = 'none';
        document.getElementById('btnProxima').style.display = 'none';
        document.getElementById('area-jogo').style.display = 'grid';
        document.getElementById('feedback').innerText = "Ligue o cubinho na figura certa!";
    }

    function selecionarItem(el, tipo, valor, som) {
        tocarSom(som);
        el.classList.add('selecionado');
        if(tipo === 'letra') {
            if(escolhaLetra) escolhaLetra.el.classList.remove('selecionado');
            escolhaLetra = { el, valor };
        } else {
            if(escolhaFigura) escolhaFigura.el.classList.remove('selecionado');
            escolhaFigura = { el, valor };
        }
        if(escolhaLetra && escolhaFigura) {
            if(escolhaLetra.valor === escolhaFigura.valor) {
                escolhaLetra.el.classList.add('correto');
                escolhaFigura.el.classList.add('correto');
                tocarSom('aplausos.ogg');
                acertos++;
                if(acertos === 5) {
                    document.getElementById('feedback').innerText = "VOCÊ É DEMAIS!";
                    setTimeout(() => tocarSom('fim_jogo.ogg'), 1000);
                }
            } else {
                tocarSom('erro.ogg');
                let l = escolhaLetra.el, f = escolhaFigura.el;
                setTimeout(() => { l.classList.remove('selecionado'); f.classList.remove('selecionado'); }, 500);
            }
            escolhaLetra = null; escolhaFigura = null;
        }
    }

    function toggleTheme() {
        const b = document.body;
        const isDark = b.getAttribute('data-theme') === 'dark';
        b.setAttribute('data-theme', isDark ? 'light' : 'dark');
        document.getElementById('btnTema').innerText = isDark ? '☀️' : '🌙';
    }
</script>
</body>
</html>
