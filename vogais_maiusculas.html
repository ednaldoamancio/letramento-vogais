<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>👸🤴 Reino das Vogais - Aprenda as Vogais</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Nunito:wght@400;600;700;800&family=Dancing+Script:wght@700&family=Fredoka+One&family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        :root {
            --rosa-princesa: #e91e8c;
            --rosa-escuro: #9c1460;
            --dourado-real: #d4a843;
            --dourado-escuro: #b8860b;
            --dourado-branco: #fff8f0;
            --noite-real: #1a0a1e;
            --verde-jardim: #2d8e5f;
            --coral: #f4845f;
            --coral-escuro: #c94a2a;
            --turquoise: #4dd0e1;
            --turquoise-escuro: #1a8a98;
            --lavender: #b39ddb;
            --lavender-escuro: #6a5590;
            --lime: #aed581;
            --lime-escuro: #6a9a2a;
            --peach: #ffab91;
            --peach-escuro: #c06040;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(180deg, #2d0a1e 0%, #1a0a1e 40%, #0d0418 100%);
            color: var(--dourado-branco);
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Estrelas cintilantes */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background:
                radial-gradient(2px 2px at 15% 25%, #fff, transparent),
                radial-gradient(2px 2px at 35% 55%, rgba(255,200,220,0.8), transparent),
                radial-gradient(1px 1px at 55% 15%, #fff, transparent),
                radial-gradient(2px 2px at 75% 45%, rgba(255,180,200,0.6), transparent),
                radial-gradient(1px 1px at 85% 75%, #fff, transparent),
                radial-gradient(2px 2px at 25% 85%, rgba(255,200,220,0.7), transparent),
                radial-gradient(1px 1px at 65% 95%, #fff, transparent),
                radial-gradient(2px 2px at 45% 35%, rgba(255,180,200,0.5), transparent),
                radial-gradient(1px 1px at 95% 35%, #fff, transparent),
                radial-gradient(2px 2px at 5% 65%, rgba(255,200,220,0.6), transparent);
            background-size: 100% 100%;
            animation: cintilarEstrelas 3s ease-in-out infinite alternate;
        }

        @keyframes cintilarEstrelas {
            0% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        /* Elementos flutuantes */
        .elemento-flutuante {
            position: fixed;
            pointer-events: none;
            z-index: 1;
            animation: flutuarElemento linear infinite;
            opacity: 0.4;
        }
        
        @keyframes flutuarElemento {
            0% { transform: translateY(100vh) scale(0.5) rotate(0deg); opacity: 0; }
            15% { opacity: 0.6; }
            85% { opacity: 0.6; }
            100% { transform: translateY(-20vh) scale(1) rotate(360deg); opacity: 0; }
        }

        .header {
            position: relative;
            z-index: 50;
            background: linear-gradient(180deg, rgba(45,10,30,0.95) 0%, rgba(26,10,30,0.8) 100%);
            border-bottom: 2px solid var(--dourado-real);
            backdrop-filter: blur(10px);
        }
        
        .header-inner {
            max-width: 900px;
            margin: 0 auto;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
        }

        .header-botoes { display: flex; gap: 10px; align-items: center; }

        .btn-fullscreen {
            background: linear-gradient(135deg, #4a148c, #6a1b9a);
            border: 2px solid var(--dourado-real);
            width: 42px;
            height: 42px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            box-shadow: 0 0 10px rgba(212, 168, 67, 0.3);
            color: white;
        }
        
        .btn-fullscreen:hover {
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(212, 168, 67, 0.5);
            background: linear-gradient(135deg, #6a1b9a, #8e24aa);
        }
        
        .btn-fullscreen.ativo {
            background: linear-gradient(135deg, var(--dourado-real), #b8860b);
            box-shadow: 0 0 20px rgba(212, 168, 67, 0.6);
        }

        .btn-musica {
            background: linear-gradient(135deg, #2d8e5f, #1a5c3a);
            border: 2px solid var(--dourado-real);
            width: 42px;
            height: 42px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            box-shadow: 0 0 10px rgba(212, 168, 67, 0.3);
            color: white;
        }
        
        .btn-musica:hover {
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(212, 168, 67, 0.5);
        }
        
        .btn-musica.ativo {
            background: linear-gradient(135deg, var(--dourado-real), #b8860b);
        }

        .btn-voltar-dourado {
            display: flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, var(--dourado-real), var(--dourado-escuro));
            border: 2px solid #fff;
            padding: 8px 20px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 800;
            font-family: 'Nunito', sans-serif;
            color: #1a0a2e;
            text-decoration: none;
            transition: all 0.3s;
            box-shadow: 0 0 15px rgba(212, 168, 67, 0.4);
            animation: brilhoDourado 1.5s ease-in-out infinite;
        }
        
        .btn-voltar-dourado:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(212, 168, 67, 0.8);
            background: linear-gradient(135deg, #e8c060, var(--dourado-real));
        }
        
        @keyframes brilhoDourado {
            0%, 100% { box-shadow: 0 0 15px rgba(212, 168, 67, 0.4); border-color: #fff; }
            50% { box-shadow: 0 0 30px rgba(212, 168, 67, 0.8); border-color: #ffe6a3; }
        }

        .stage {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 15px;
            position: relative;
            z-index: 10;
            gap: 15px;
            overflow-y: auto;
            overflow-x: hidden;
        }

        .conteudo-central {
            max-width: 700px;
            width: 100%;
            margin: 0 auto;
            text-align: center;
        }

        /* Títulos */
        .titulo-reino {
            font-family: 'Cinzel Decorative', cursive;
            font-size: clamp(20px, 5vw, 28px);
            color: var(--dourado-real);
            text-shadow: 0 0 15px rgba(233, 30, 140, 0.5), 2px 2px 4px rgba(0,0,0,0.5);
            text-align: center;
            margin-bottom: 5px;
        }
        
        .subtitulo-real {
            font-family: 'Dancing Script', cursive;
            font-size: clamp(14px, 4vw, 18px);
            color: rgba(255, 255, 255, 0.7);
            text-align: center;
            margin-bottom: 15px;
        }

        /* Botões de modalidade */
        .modalidades-botoes {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        
        .btn-modalidade {
            padding: 10px 18px;
            border-radius: 50px;
            border: 2px solid var(--dourado-real);
            background: rgba(212, 168, 67, 0.15);
            color: var(--dourado-real);
            font-family: 'Nunito', sans-serif;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s;
            backdrop-filter: blur(5px);
        }
        
        .btn-modalidade:hover {
            background: rgba(212, 168, 67, 0.35);
            transform: translateY(-2px);
            box-shadow: 0 0 15px rgba(212, 168, 67, 0.3);
        }
        
        .btn-modalidade.ativo {
            background: linear-gradient(135deg, var(--dourado-real), var(--dourado-escuro));
            color: #1a0a2e;
            border-color: #fff;
            box-shadow: 0 0 20px rgba(212, 168, 67, 0.5);
        }

        /* Card de exibição */
        .card-exibicao {
            background: rgba(255,255,255,0.1);
            border: 2px solid var(--dourado-real);
            border-radius: 25px;
            padding: 15px;
            max-width: 320px;
            margin: 0 auto 15px;
            min-height: 240px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
        }
        
        .letra-grande {
            font-size: 100px;
            display: block;
            text-shadow: 4px 4px 0 rgba(0,0,0,0.2);
            color: var(--dourado-branco);
            transition: all 0.2s;
        }
        
        /* Fontes específicas para cada modalidade */
        .modal-maiuscula-forma .letra-grande { font-family: 'Fredoka One', cursive; }
        .modal-minuscula-forma .letra-grande { font-family: 'Nunito', sans-serif; font-weight: 800; }
        .modal-maiuscula-cursiva .letra-grande { font-family: 'Great Vibes', cursive; font-size: 110px; }
        .modal-minuscula-cursiva .letra-grande { font-family: 'Great Vibes', cursive; font-size: 110px; }
        
        .imagem-figura {
            width: 120px;
            height: 120px;
            object-fit: contain;
            display: none;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
        }
        
        .imagem-figura.ativo {
            display: block;
            animation: fadeInScale 0.5s ease-out;
        }
        
        .video-player {
            width: 100%;
            max-width: 280px;
            border-radius: 15px;
            display: none;
        }
        
        .video-player.ativo {
            display: block;
        }
        
        @keyframes fadeInScale {
            from { opacity: 0; transform: scale(0.5); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Blocos das vogais */
        .blocos-container {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }
        
        .bloco-vogal {
            width: 65px;
            height: 65px;
            border-radius: 15px;
            border: none;
            font-size: 2rem;
            color: #fff;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        /* Fontes dos blocos conforme modalidade */
        .modal-maiuscula-forma .bloco-vogal { font-family: 'Fredoka One', cursive; }
        .modal-minuscula-forma .bloco-vogal { font-family: 'Nunito', sans-serif; font-weight: 800; text-transform: lowercase; }
        .modal-maiuscula-cursiva .bloco-vogal { font-family: 'Great Vibes', cursive; font-size: 2.2rem; }
        .modal-minuscula-cursiva .bloco-vogal { font-family: 'Great Vibes', cursive; font-size: 2.2rem; text-transform: lowercase; }
        
        .bloco-A, .bloco-a { background: var(--coral); box-shadow: 0 5px var(--coral-escuro); }
        .bloco-E, .bloco-e { background: var(--turquoise); box-shadow: 0 5px var(--turquoise-escuro); }
        .bloco-I, .bloco-i { background: var(--lavender); box-shadow: 0 5px var(--lavender-escuro); }
        .bloco-O, .bloco-o { background: var(--lime); box-shadow: 0 5px var(--lime-escuro); }
        .bloco-U, .bloco-u { background: var(--peach); box-shadow: 0 5px var(--peach-escuro); }
        
        .bloco-vogal:hover { transform: scale(1.1) translateY(-3px); }
        .bloco-vogal:active { transform: scale(0.95); }

        /* Botões de ação */
        .btn-acao {
            padding: 12px 28px;
            border-radius: 50px;
            border: none;
            font-family: 'Nunito', sans-serif;
            font-weight: 800;
            font-size: 16px;
            cursor: pointer;
            margin: 5px;
            transition: all 0.3s;
        }
        
        .btn-iniciar {
            background: linear-gradient(135deg, var(--turquoise), #26a8b8);
            color: white;
            box-shadow: 0 4px 0 #1a8a98;
        }
        
        .btn-proxima {
            background: linear-gradient(135deg, #ffcc00, #e6b800);
            color: #5d4037;
            display: none;
        }
        
        .btn-reiniciar {
            background: linear-gradient(135deg, var(--lime), #8bc34a);
            color: white;
            display: none;
        }
        
        .btn-acao:hover { transform: translateY(-2px); }
        .btn-acao:active { transform: translateY(2px); }

        /* Jogo de ligação */
        .jogo-ligacao {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            max-width: 500px;
            width: 100%;
            margin: 15px auto;
            display: none;
        }
        
        .coluna {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .item-jogo {
            border-radius: 15px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 80px;
            width: 100%;
            border: none;
            opacity: 0;
        }
        
        .cubo-letra {
            color: white;
            border-radius: 12px;
        }
        
        .modal-maiuscula-forma .cubo-letra { font-family: 'Fredoka One', cursive; font-size: 45px; }
        .modal-minuscula-forma .cubo-letra { font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 45px; text-transform: lowercase; }
        .modal-maiuscula-cursiva .cubo-letra { font-family: 'Great Vibes', cursive; font-size: 50px; }
        .modal-minuscula-cursiva .cubo-letra { font-family: 'Great Vibes', cursive; font-size: 50px; text-transform: lowercase; }
        
        .cubo-figura {
            border: 3px solid var(--dourado-real);
            background: rgba(255,255,255,0.9);
            border-radius: 12px;
        }
        
        .cubo-figura img {
            width: 60px;
            height: 60px;
            object-fit: contain;
        }
        
        .selecionado {
            transform: scale(1.08);
            outline: 4px solid #ffcc00;
            z-index: 2;
            opacity: 1 !important;
        }
        
        .correto {
            opacity: 0.5 !important;
            pointer-events: none;
            transform: scale(0.9);
            filter: grayscale(0.3);
        }
        
        .feedback-texto {
            font-family: 'Dancing Script', cursive;
            font-size: clamp(18px, 5vw, 24px);
            text-align: center;
            margin: 10px 0;
            color: var(--dourado-real);
        }
        
        @keyframes cuboPulo {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.1); }
            70% { transform: scale(0.9); }
            100% { transform: scale(1); opacity: 1; }
        }
        
        .animar-pulo {
            animation: cuboPulo 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
        }
        
        .decoracao-castelo {
            margin-top: 15px;
            font-size: 18px;
            opacity: 0.4;
            letter-spacing: 8px;
            text-align: center;
        }
        
        @media (max-width: 550px) {
            .bloco-vogal { width: 55px; height: 55px; font-size: 1.6rem; }
            .letra-grande { font-size: 70px; }
            .modal-maiuscula-cursiva .letra-grande,
            .modal-minuscula-cursiva .letra-grande { font-size: 80px; }
            .card-exibicao { min-height: 200px; max-width: 280px; }
            .cubo-figura img { width: 45px; height: 45px; }
            .btn-acao { padding: 10px 20px; font-size: 14px; }
            .btn-voltar-dourado { padding: 6px 15px; font-size: 12px; }
            .btn-modalidade { padding: 6px 12px; font-size: 11px; }
        }
        
        .stage::-webkit-scrollbar {
            width: 4px;
        }
        
        .stage::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
        }
        
        .stage::-webkit-scrollbar-thumb {
            background: var(--dourado-real);
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <div id="elementos-container"></div>

    <header class="header">
        <div class="header-inner">
            <a href="vogais.html" class="btn-voltar-dourado">← ✨ Voltar ao Reino ✨</a>
            <div class="header-botoes">
                <button class="btn-musica" id="btnMusica" title="Música de fundo">🎵</button>
                <button class="btn-fullscreen" id="btnFullscreen" title="Tela Cheia">⛶</button>
            </div>
        </div>
    </header>

    <div class="stage">
        <div class="conteudo-central">
            <h1 class="titulo-reino">🏰 Aprenda as Vogais</h1>
            <p class="subtitulo-real">Escolha o estilo mágico das letras ✨</p>
            
            <!-- Botões de modalidade -->
            <div class="modalidades-botoes">
                <button class="btn-modalidade" data-modal="maiuscula-forma" data-audio="maiuscula_forma.mp3">🏰 Maiúscula Forma</button>
                <button class="btn-modalidade" data-modal="minuscula-forma" data-audio="minuscula_forma.mp3">🌹 Minúscula Forma</button>
                <button class="btn-modalidade" data-modal="maiuscula-cursiva" data-audio="maiuscula_cursiva.mp3">✨ Maiúscula Cursiva</button>
                <button class="btn-modalidade" data-modal="minuscula-cursiva" data-audio="minuscula_cursiva.mp3">🦋 Minúscula Cursiva</button>
            </div>
            
            <div id="area-apresentacao">
                <div class="card-exibicao">
                    <span id="display-letra" class="letra-grande">✨</span>
                    <img id="imagem-figura" class="imagem-figura" alt="Figura da vogal">
                    <video id="meuVideo" class="video-player" playsinline></video>
                </div>

                <div class="blocos-container" id="blocos-container">
                    <button class="bloco-vogal bloco-A" data-letra="A" data-som="vogal_a.ogg" data-video="a_de_aviao.mp4" data-imagem="aviao.png">A</button>
                    <button class="bloco-vogal bloco-E" data-letra="E" data-som="vogal_e.ogg" data-video="e_de_elefante.mp4" data-imagem="elefante.png">E</button>
                    <button class="bloco-vogal bloco-I" data-letra="I" data-som="vogal_i.ogg" data-video="i_de_iguana.mp4" data-imagem="iguana.png">I</button>
                    <button class="bloco-vogal bloco-O" data-letra="O" data-som="vogal_o.ogg" data-video="o_de_de_ovo.mp4" data-imagem="ovo.png">O</button>
                    <button class="bloco-vogal bloco-U" data-letra="U" data-som="vogal_u.ogg" data-video="u_de_unicornio.mp4" data-imagem="unicornio.png">U</button>
                </div>
                
                <button class="btn-acao btn-iniciar" id="btnIniciar">▶ Começar Apresentação</button>
            </div>

            <div id="area-jogo" class="jogo-ligacao">
                <div class="coluna" id="colunaLetras"></div>
                <div class="coluna" id="colunaFiguras"></div>
            </div>

            <div class="feedback-texto" id="feedback">✨ Clique em uma letra para começar! ✨</div>
            
            <button class="btn-acao btn-proxima" id="btnProxima">🌟 PRÓXIMA ATIVIDADE</button>
            <button class="btn-acao btn-reiniciar" id="btnReiniciar">🔁 Jogar Novamente</button>
            
            <div class="decoracao-castelo">👑 💖 🏰 💖 👑</div>
        </div>
    </div>

    <script>
        // ========== MÚSICA DE FUNDO ==========
        let musicaFundo = null;
        let musicaAtiva = false;
        
        function toggleMusica() {
            const btn = document.getElementById('btnMusica');
            if (!musicaFundo) {
                musicaFundo = new Audio('musica_fundo.ogg');
                musicaFundo.loop = true;
                musicaFundo.volume = 0.3;
            }
            if (musicaAtiva) {
                musicaFundo.pause();
                musicaAtiva = false;
                btn.classList.remove('ativo');
                btn.innerHTML = '🎵';
            } else {
                musicaFundo.play().catch(e => console.log('Música bloqueada pelo navegador.'));
                musicaAtiva = true;
                btn.classList.add('ativo');
                btn.innerHTML = '🎵';
            }
        }
        
        // ========== ESTADO DA MODALIDADE ==========
        let modalidadeAtual = 'maiuscula-forma';
        
        // Dados das vogais
        const dadosVogais = {
            'A': { som: 'vogal_a.ogg', video: 'a_de_aviao.mp4', imagem: 'aviao.png', nome: 'A de Avião' },
            'E': { som: 'vogal_e.ogg', video: 'e_de_elefante.mp4', imagem: 'elefante.png', nome: 'E de Elefante' },
            'I': { som: 'vogal_i.ogg', video: 'i_de_iguana.mp4', imagem: 'iguana.png', nome: 'I de Iguana' },
            'O': { som: 'vogal_o.ogg', video: 'o_de_de_ovo.mp4', imagem: 'ovo.png', nome: 'O de Ovo' },
            'U': { som: 'vogal_u.ogg', video: 'u_de_unicornio.mp4', imagem: 'unicornio.png', nome: 'U de Unicórnio' }
        };
        
        const dadosVogaisMinusculas = {
            'a': { som: 'vogal_a.ogg', video: 'a_de_aviao.mp4', imagem: 'aviao.png', nome: 'a de Avião' },
            'e': { som: 'vogal_e.ogg', video: 'e_de_elefante.mp4', imagem: 'elefante.png', nome: 'e de Elefante' },
            'i': { som: 'vogal_i.ogg', video: 'i_de_iguana.mp4', imagem: 'iguana.png', nome: 'i de Iguana' },
            'o': { som: 'vogal_o.ogg', video: 'o_de_de_ovo.mp4', imagem: 'ovo.png', nome: 'o de Ovo' },
            'u': { som: 'vogal_u.ogg', video: 'u_de_unicornio.mp4', imagem: 'unicornio.png', nome: 'u de Unicórnio' }
        };
        
        const coresVogais = {
            'A': '#f4845f', 'E': '#4dd0e1', 'I': '#b39ddb', 'O': '#aed581', 'U': '#ffab91',
            'a': '#f4845f', 'e': '#4dd0e1', 'i': '#b39ddb', 'o': '#aed581', 'u': '#ffab91'
        };
        
        // Função para atualizar a fonte conforme modalidade
        function atualizarEstilosModalidade() {
            const body = document.body;
            body.classList.remove('modal-maiuscula-forma', 'modal-minuscula-forma', 'modal-maiuscula-cursiva', 'modal-minuscula-cursiva');
            body.classList.add(`modal-${modalidadeAtual}`);
            
            const botoesVogais = document.querySelectorAll('.bloco-vogal');
            const ehMaiuscula = modalidadeAtual === 'maiuscula-forma' || modalidadeAtual === 'maiuscula-cursiva';
            
            botoesVogais.forEach(btn => {
                const letraOriginal = btn.getAttribute('data-letra');
                if (ehMaiuscula) {
                    btn.innerText = letraOriginal.toUpperCase();
                    btn.classList.remove('bloco-a', 'bloco-e', 'bloco-i', 'bloco-o', 'bloco-u');
                    btn.classList.add(`bloco-${letraOriginal.toUpperCase()}`);
                } else {
                    btn.innerText = letraOriginal.toLowerCase();
                    btn.classList.remove('bloco-A', 'bloco-E', 'bloco-I', 'bloco-O', 'bloco-U');
                    btn.classList.add(`bloco-${letraOriginal.toLowerCase()}`);
                }
            });
            
            const display = document.getElementById('display-letra');
            const imagemFigura = document.getElementById('imagem-figura');
            const player = document.getElementById('meuVideo');
            imagemFigura.classList.remove('ativo');
            player.classList.remove('ativo');
            player.pause();
            display.style.display = 'block';
            display.innerText = '✨';
        }
        
        // Função para tocar som (para qualquer áudio)
        let somAtual = null;
        
        function tocarSom(arquivo) {
            if (!arquivo) return;
            try {
                if (somAtual) {
                    somAtual.pause();
                    somAtual.currentTime = 0;
                }
                somAtual = new Audio(arquivo);
                somAtual.play().catch(e => console.log('Áudio:', e));
            } catch(e) { console.log('Erro no áudio:', e); }
        }
        
        // Tocar vogal completa (com vídeo e imagem)
        function tocarVogal(letra) {
            const display = document.getElementById('display-letra');
            const imagemFigura = document.getElementById('imagem-figura');
            const player = document.getElementById('meuVideo');
            const ehMaiuscula = modalidadeAtual === 'maiuscula-forma' || modalidadeAtual === 'maiuscula-cursiva';
            
            const dados = ehMaiuscula ? dadosVogais : dadosVogaisMinusculas;
            const letraKey = ehMaiuscula ? letra.toUpperCase() : letra.toLowerCase();
            const dadosLetra = dados[letraKey];
            
            if (!dadosLetra) return;
            
            if (player && !player.paused) {
                player.pause();
                player.currentTime = 0;
            }
            player.classList.remove('ativo');
            imagemFigura.classList.remove('ativo');
            
            tocarSom(dadosLetra.som);
            
            display.style.display = 'block';
            display.style.transform = 'scale(1.1)';
            display.innerText = ehMaiuscula ? letra.toUpperCase() : letra.toLowerCase();
            display.style.color = coresVogais[letraKey];
            
            setTimeout(() => {
                display.style.transform = 'scale(1)';
            }, 200);
            
            setTimeout(() => {
                display.style.display = 'none';
                player.src = dadosLetra.video;
                player.classList.add('ativo');
                player.play().catch(e => console.log('Vídeo:', e));
                
                player.onended = () => {
                    player.classList.remove('ativo');
                    imagemFigura.src = dadosLetra.imagem;
                    imagemFigura.classList.add('ativo');
                    tocarSom('acerto.ogg');
                    
                    setTimeout(() => {
                        imagemFigura.classList.remove('ativo');
                        display.style.display = 'block';
                        display.innerText = ehMaiuscula ? letra.toUpperCase() : letra.toLowerCase();
                    }, 2000);
                };
            }, 1500);
            
            document.getElementById('btnProxima').style.display = 'inline-block';
            document.getElementById('feedback').innerHTML = `✨ ${dadosLetra.nome} ✨`;
        }
        
        // Apresentação automática
        function iniciarApresentacao() {
            const ehMaiuscula = modalidadeAtual === 'maiuscula-forma' || modalidadeAtual === 'maiuscula-cursiva';
            const ordem = ehMaiuscula ? ['A', 'E', 'I', 'O', 'U'] : ['a', 'e', 'i', 'o', 'u'];
            let i = 0;
            const btnIniciar = document.getElementById('btnIniciar');
            btnIniciar.style.display = 'none';
            document.getElementById('feedback').innerHTML = '🎭 Assistindo ao espetáculo real...';
            
            function proximo() {
                if (i < ordem.length) {
                    const letra = ordem[i];
                    const display = document.getElementById('display-letra');
                    const imagemFigura = document.getElementById('imagem-figura');
                    const player = document.getElementById('meuVideo');
                    const dados = ehMaiuscula ? dadosVogais : dadosVogaisMinusculas;
                    const letraKey = ehMaiuscula ? letra.toUpperCase() : letra.toLowerCase();
                    const dadosLetra = dados[letraKey];
                    
                    if (player && !player.paused) {
                        player.pause();
                        player.currentTime = 0;
                    }
                    player.classList.remove('ativo');
                    imagemFigura.classList.remove('ativo');
                    
                    tocarSom(dadosLetra.som);
                    display.style.display = 'block';
                    display.innerText = letra;
                    display.style.color = coresVogais[letraKey];
                    
                    setTimeout(() => {
                        display.style.display = 'none';
                        player.src = dadosLetra.video;
                        player.classList.add('ativo');
                        player.play().catch(e => console.log('Vídeo:', e));
                        
                        player.onended = () => {
                            player.classList.remove('ativo');
                            imagemFigura.src = dadosLetra.imagem;
                            imagemFigura.classList.add('ativo');
                            tocarSom('acerto.ogg');
                            
                            setTimeout(() => {
                                imagemFigura.classList.remove('ativo');
                                display.style.display = 'block';
                                display.innerText = letra;
                                i++;
                                setTimeout(proximo, 2000);
                            }, 2000);
                        };
                    }, 1500);
                } else {
                    document.getElementById('feedback').innerHTML = '📖 Maravilhoso! Agora pratique! 📖';
                    document.getElementById('btnProxima').style.display = 'inline-block';
                }
            }
            proximo();
        }
        
        // Jogo de ligação
        let escolhaLetra = null;
        let escolhaFigura = null;
        let acertos = 0;
        
        const figurasJogo = [
            { letra: 'A', imagem: 'aviao.png', cor: '#f4845f', som: 'vogal_a.ogg' },
            { letra: 'E', imagem: 'elefante.png', cor: '#4dd0e1', som: 'vogal_e.ogg' },
            { letra: 'I', imagem: 'iguana.png', cor: '#b39ddb', som: 'vogal_i.ogg' },
            { letra: 'O', imagem: 'ovo.png', cor: '#aed581', som: 'vogal_o.ogg' },
            { letra: 'U', imagem: 'unicornio.png', cor: '#ffab91', som: 'vogal_u.ogg' }
        ];
        
        function montarJogo() {
            const colLetras = document.getElementById('colunaLetras');
            const colFiguras = document.getElementById('colunaFiguras');
            colLetras.innerHTML = '';
            colFiguras.innerHTML = '';
            acertos = 0;
            escolhaLetra = null;
            escolhaFigura = null;
            
            const ehMaiuscula = modalidadeAtual === 'maiuscula-forma' || modalidadeAtual === 'maiuscula-cursiva';
            const letrasMisturadas = [...figurasJogo].sort(() => Math.random() - 0.5);
            const figurasMisturadas = [...figurasJogo].sort(() => Math.random() - 0.5);
            
            letrasMisturadas.forEach((d, index) => {
                const div = document.createElement('div');
                div.className = `item-jogo cubo-letra animar-pulo`;
                div.style.backgroundColor = d.cor;
                div.style.boxShadow = `0 4px 0 ${d.cor}99`;
                div.style.animationDelay = `${index * 0.1}s`;
                div.innerText = ehMaiuscula ? d.letra : d.letra.toLowerCase();
                div.setAttribute('data-letra', d.letra);
                div.setAttribute('data-som', d.som);
                div.onclick = () => selecionarItem(div, 'letra', d.letra, d.som);
                colLetras.appendChild(div);
            });
            
            figurasMisturadas.forEach((d, index) => {
                const div = document.createElement('div');
                div.className = 'item-jogo cubo-figura animar-pulo';
                div.style.animationDelay = `${(index + 2) * 0.1}s`;
                div.innerHTML = `<img src="${d.imagem}" alt="${d.letra}">`;
                div.setAttribute('data-letra', d.letra);
                div.setAttribute('data-som', d.som);
                div.onclick = () => selecionarItem(div, 'figura', d.letra, d.som);
                colFiguras.appendChild(div);
            });
        }
        
        function irParaJogo() {
            document.getElementById('area-apresentacao').style.display = 'none';
            document.getElementById('btnProxima').style.display = 'none';
            document.getElementById('area-jogo').style.display = 'grid';
            document.getElementById('feedback').innerHTML = '🔗 Ligue cada letra à sua figura! 🔗';
            document.getElementById('btnReiniciar').style.display = 'none';
            montarJogo();
        }
        
        function selecionarItem(el, tipo, valor, som) {
            tocarSom(som);
            el.classList.add('selecionado');
            
            if (tipo === 'letra') {
                if (escolhaLetra) escolhaLetra.el.classList.remove('selecionado');
                escolhaLetra = { el, valor };
            } else {
                if (escolhaFigura) escolhaFigura.el.classList.remove('selecionado');
                escolhaFigura = { el, valor };
            }
            
            if (escolhaLetra && escolhaFigura) {
                if (escolhaLetra.valor === escolhaFigura.valor) {
                    escolhaLetra.el.classList.add('correto');
                    escolhaFigura.el.classList.add('correto');
                    tocarSom('aplausos.ogg');
                    acertos++;
                    document.getElementById('feedback').innerHTML = `🎉 Correto! ${acertos}/5 🎉`;
                    
                    if (acertos === 5) {
                        document.getElementById('feedback').innerHTML = "🏆 PARABÉNS! VOCÊ COMPLETOU O REINO! 🏆";
                        document.getElementById('btnReiniciar').style.display = 'inline-block';
                        tocarSom('fim_jogo.ogg');
                    }
                } else {
                    tocarSom('erro.ogg');
                    document.getElementById('feedback').innerHTML = '❌ Tente novamente! ❌';
                    const l = escolhaLetra.el;
                    const f = escolhaFigura.el;
                    setTimeout(() => {
                        l.classList.remove('selecionado');
                        f.classList.remove('selecionado');
                        document.getElementById('feedback').innerHTML = '🔗 Ligue cada letra à sua figura! 🔗';
                    }, 500);
                }
                escolhaLetra = null;
                escolhaFigura = null;
            }
        }
        
        function reiniciarJogo() {
            montarJogo();
            document.getElementById('btnReiniciar').style.display = 'none';
            document.getElementById('feedback').innerHTML = '🔗 Ligue cada letra à sua figura! 🔗';
            tocarSom('inicio.ogg');
        }
        
        // ========== FULLSCREEN ==========
        const FS_KEY = 'reinoFullscreen';
        
        function isFullscreen() {
            return !!(document.fullscreenElement || document.webkitFullscreenElement);
        }
        
        function enterFullscreen() {
            const elem = document.documentElement;
            if (elem.requestFullscreen) elem.requestFullscreen().catch(() => {});
            else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
        }
        
        function exitFullscreen() {
            if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
            else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
        }
        
        function toggleFullscreen() {
            if (isFullscreen()) {
                exitFullscreen();
                localStorage.setItem(FS_KEY, 'false');
            } else {
                enterFullscreen();
                localStorage.setItem(FS_KEY, 'true');
            }
            atualizarIconeFullscreen();
        }
        
        function atualizarIconeFullscreen() {
            const btn = document.getElementById('btnFullscreen');
            if (isFullscreen()) {
                btn.innerHTML = '✖';
                btn.classList.add('ativo');
            } else {
                btn.innerHTML = '⛶';
                btn.classList.remove('ativo');
            }
        }
        
        function setupFullscreenListeners() {
            const events = ['fullscreenchange', 'webkitfullscreenchange'];
            events.forEach(event => {
                document.addEventListener(event, () => {
                    atualizarIconeFullscreen();
                    if (!isFullscreen()) localStorage.setItem(FS_KEY, 'false');
                });
            });
        }
        
        function restaurarFullscreen() {
            const deveFullscreen = localStorage.getItem(FS_KEY) === 'true';
            if (deveFullscreen && !isFullscreen()) {
                setTimeout(() => enterFullscreen(), 100);
            }
            atualizarIconeFullscreen();
        }
        
        // ========== ELEMENTOS FLUTUANTES ==========
        function criarElementosFlutuantes() {
            const container = document.getElementById('elementos-container');
            const elementos = ['💖', '💕', '💗', '✨', '🌟', '👑', '🌸', '🦋'];
            const cores = ['#e91e8c', '#ff80c0', '#d4a843', '#ff4081', '#4caf50'];
            
            function adicionarElemento() {
                const c = document.createElement('div');
                c.className = 'elemento-flutuante';
                c.innerText = elementos[Math.floor(Math.random() * elementos.length)];
                c.style.left = Math.random() * 100 + '%';
                c.style.fontSize = (Math.random() * 14 + 12) + 'px';
                c.style.color = cores[Math.floor(Math.random() * cores.length)];
                c.style.animationDuration = (Math.random() * 6 + 5) + 's';
                container.appendChild(c);
                setTimeout(() => c.remove(), 11000);
            }
            
            for (let i = 0; i < 15; i++) {
                setTimeout(adicionarElemento, i * 400);
            }
            setInterval(adicionarElemento, 3000);
        }
        
        // ========== CONFIGURAÇÃO ==========
        function configurarBotoes() {
            // Botões das vogais: click e mouseenter
            const botoesVogais = document.querySelectorAll('.bloco-vogal');
            botoesVogais.forEach(btn => {
                btn.addEventListener('click', () => {
                    const letra = btn.getAttribute('data-letra');
                    tocarVogal(letra);
                });
                // Ao passar o mouse, toca o som da vogal (acessibilidade)
                btn.addEventListener('mouseenter', () => {
                    const som = btn.getAttribute('data-som');
                    if (som) tocarSom(som);
                });
            });
            
            // Botões das modalidades: click e mouseenter
            const botoesModalidade = document.querySelectorAll('.btn-modalidade');
            botoesModalidade.forEach(btn => {
                btn.addEventListener('click', () => {
                    botoesModalidade.forEach(b => b.classList.remove('ativo'));
                    btn.classList.add('ativo');
                    modalidadeAtual = btn.getAttribute('data-modal');
                    atualizarEstilosModalidade();
                    
                    const display = document.getElementById('display-letra');
                    const imagemFigura = document.getElementById('imagem-figura');
                    const player = document.getElementById('meuVideo');
                    imagemFigura.classList.remove('ativo');
                    player.classList.remove('ativo');
                    player.pause();
                    display.style.display = 'block';
                    display.innerText = '✨';
                    
                    tocarSom('inicio.ogg');
                });
                // Ao passar o mouse, toca o áudio descritivo da modalidade
                btn.addEventListener('mouseenter', () => {
                    const audioFile = btn.getAttribute('data-audio');
                    if (audioFile) tocarSom(audioFile);
                });
            });
            
            // Ativar primeira modalidade por padrão
            const primeiroBotao = document.querySelector('.btn-modalidade');
            if (primeiroBotao) primeiroBotao.classList.add('ativo');
            
            document.getElementById('btnIniciar').addEventListener('click', iniciarApresentacao);
            document.getElementById('btnProxima').addEventListener('click', irParaJogo);
            document.getElementById('btnReiniciar').addEventListener('click', reiniciarJogo);
            document.getElementById('btnFullscreen').addEventListener('click', toggleFullscreen);
            document.getElementById('btnMusica').addEventListener('click', toggleMusica);
        }
        
        window.onload = function() {
            criarElementosFlutuantes();
            setupFullscreenListeners();
            restaurarFullscreen();
            configurarBotoes();
            atualizarEstilosModalidade();
            tocarSom('inicio.ogg');
        };
    </script>
