<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
    <title>Jornada das Letras: Atividades</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Nunito:wght@400;700;800&family=Fredoka+One&display=swap" rel="stylesheet">
    <style>
        :root {
            --coral: #f4845f; --coral-dark: #e05a3a;
            --turquoise: #4dd0e1; --turquoise-dark: #26a8b8;
            --lavender: #b39ddb; --lavender-dark: #8e79c0;
            --lime: #aed581; --lime-dark: #8bc34a;
            --peach: #ffab91; --peach-dark: #e08060;
            --paper: #fefcf3; --brown: #5d4037;
            --ruled-line: #add8e6; --margin-line: #ff9999;
            --header-bg: rgba(254, 252, 243, 0.92);
        }
        [data-theme="dark"] {
            --paper: #2c3e50; --brown: #ecf0f1;
            --ruled-line: #34495e; --margin-line: #e74c3c;
            --header-bg: rgba(44, 62, 80, 0.92);
        }
        body { font-family: 'Nunito', sans-serif; background: var(--paper); color: var(--brown); min-height: 100vh; overflow-x: hidden; }
        body::before { content: ''; position: fixed; inset: 0; z-index: 0; background: repeating-linear-gradient(0deg, transparent, transparent 30px, var(--ruled-line) 30px, var(--ruled-line) 31px); background-size: 100% 31px; }
        body::after { content: ''; position: fixed; top: 0; bottom: 0; left: clamp(40px, 8vw, 80px); width: 2px; background: var(--margin-line); opacity: 0.6; }

        .header { position: sticky; top: 0; z-index: 50; background: var(--header-bg); border-bottom: 2px solid var(--ruled-line); }
        .header-inner { max-width: 800px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; }
        
        .stage { max-width: 700px; margin: 24px auto; padding: 0 16px; position: relative; z-index: 10; text-align: center; }
        
        /* Video Card */
        .video-card { background: rgba(255,255,255,0.2); border: 2px solid var(--ruled-line); border-radius: 20px; padding: 10px; max-width: 320px; margin: 0 auto 20px; }
        .video-player { width: 100%; border-radius: 12px; display: none; }
        .video-player.ativo { display: block; }

        /* Botões Vogais */
        .blocos-container { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
        .bloco-vogal { width: 55px; height: 55px; border-radius: 12px; border: none; font-family: 'Fredoka One', cursive; font-size: 1.5rem; color: #fff; cursor: pointer; transition: 0.2s; }
        .bloco-vogal:hover { transform: scale(1.1); }
        .bloco-A { background: var(--coral); box-shadow: 0 4px var(--coral-dark); }
        .bloco-E { background: var(--turquoise); box-shadow: 0 4px var(--turquoise-dark); }
        .bloco-I { background: var(--lavender); box-shadow: 0 4px var(--lavender-dark); }
        .bloco-O { background: var(--lime); box-shadow: 0 4px var(--lime-dark); }
        .bloco-U { background: var(--peach); box-shadow: 0 4px var(--peach-dark); }

        /* Jogo de Ligação */
        .jogo-ligacao { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; max-width: 400px; margin: 40px auto; display: none; }
        .coluna { display: flex; flex-direction: column; gap: 15px; }
        .item-jogo { padding: 15px; background: white; border: 3px solid var(--ruled-line); border-radius: 15px; cursor: pointer; font-family: 'Fredoka One', cursive; font-size: 20px; transition: 0.2s; }
        .item-jogo img { width: 60px; height: 60px; object-fit: contain; }
        .selecionado { border-color: var(--coral); background: #fff5f0; transform: scale(1.05); }
        .correto { background: #d4edda !important; border-color: #28a745 !important; opacity: 0.6; pointer-events: none; }

        .btn-acao { padding: 15px 30px; border-radius: 50px; border: none; font-family: 'Nunito', sans-serif; font-weight: 800; cursor: pointer; margin-top: 20px; box-shadow: 0 4px 0 #bbb; }
        .btn-proxima { background: #ffcc00; color: #5d4037; display: none; }
        
        #placeholder-img { font-size: 60px; padding: 40px; }
    </style>
</head>
<body>

<header class="header">
    <div class="header-inner">
        <a href="vogais.html" style="text-decoration:none; color:inherit; font-weight:800;">⬅ VOLTAR</a>
        <button onclick="toggleTheme()" style="background:none; border:none; font-size:20px; cursor:pointer;" id="btnTema">☀️</button>
    </div>
</header>

<div class="stage">
    <h2 id="feedback" style="font-family: 'Patrick Hand'; font-size: 30px;">Vamos aprender as Vogais!</h2>
    
    <div id="area-apresentacao">
        <div class="video-card">
            <div id="placeholder-img">🎬</div>
            <video id="meuVideo" class="video-player" playsinline></video>
        </div>

        <div class="blocos-container">
            <button class="bloco-vogal bloco-A" onmouseenter="ouvirLetra('A.mp3')" onclick="tocarVogal('A')">A</button>
            <button class="bloco-vogal bloco-E" onmouseenter="ouvirLetra('E.mp3')" onclick="tocarVogal('E')">E</button>
            <button class="bloco-vogal bloco-I" onmouseenter="ouvirLetra('I.mp3')" onclick="tocarVogal('I')">I</button>
            <button class="bloco-vogal bloco-O" onmouseenter="ouvirLetra('O.mp3')" onclick="tocarVogal('O')">O</button>
            <button class="bloco-vogal bloco-U" onmouseenter="ouvirLetra('U.mp3')" onclick="tocarVogal('U')">U</button>
        </div>
        
        <button class="btn-acao" id="btnIniciar" onclick="iniciarApresentacao()">▶ Começar Apresentação</button>
    </div>

    <div id="area-jogo" class="jogo-ligacao">
        <div class="coluna" id="colunaLetras">
            <div class="item-jogo" onclick="selecionarItem(this, 'letra', 'A')">A</div>
            <div class="item-jogo" onclick="selecionarItem(this, 'letra', 'I')">I</div>
            <div class="item-jogo" onclick="selecionarItem(this, 'letra', 'E')">E</div>
            <div class="item-jogo" onclick="selecionarItem(this, 'letra', 'U')">U</div>
            <div class="item-jogo" onclick="selecionarItem(this, 'letra', 'O')">O</div>
        </div>
        <div class="coluna" id="colunaFiguras">
            <div class="item-jogo" onclick="selecionarItem(this, 'figura', 'E')"><img src="elefante.png" alt="Elefante"></div>
            <div class="item-jogo" onclick="selecionarItem(this, 'figura', 'A')"><img src="aviao.png" alt="Avião"></div>
            <div class="item-jogo" onclick="selecionarItem(this, 'figura', 'O')"><img src="ovo.png" alt="Ovo"></div>
            <div class="item-jogo" onclick="selecionarItem(this, 'figura', 'U')"><img src="unicornio.png" alt="Unicórnio"></div>
            <div class="item-jogo" onclick="selecionarItem(this, 'figura', 'I')"><img src="iguana.png" alt="Iguana"></div>
        </div>
    </div>

    <button class="btn-acao btn-proxima" id="btnProxima" onmouseenter="ouvirLetra('proxima_atividade.mp3')" onclick="irParaJogo()">🌟 PRÓXIMA ATIVIDADE</button>
</div>

<script>
    const videos = { A: 'a_de_aviao.mp4', E: 'e_de_elefante.mp4', I: 'i_de_iguana.mp4', O: 'o_de_de_ovo.mp4', U: 'u_de_unicornio.mp4' };
    const player = document.getElementById('meuVideo');
    const feedback = document.getElementById('feedback');
    let somLetra;

    function ouvirLetra(arq) {
        if(somLetra) somLetra.pause();
        somLetra = new Audio(arq);
        somLetra.play().catch(e => {});
    }

    function mostrarAnimacao(letra) {
        document.getElementById('placeholder-img').style.display = 'none';
        player.src = videos[letra];
        player.classList.add('ativo');
        player.loop = false; // Sem loop
        player.play();
    }

    function tocarVogal(letra) {
        mostrarAnimacao(letra);
        feedback.innerText = "Letra " + letra;
        player.onended = () => { /* Fica parado no último frame */ };
        document.getElementById('btnProxima').style.display = 'inline-block';
    }

    function iniciarApresentacao() {
        let sequencia = ['A','E','I','O','U'];
        let i = 0;
        document.getElementById('btnIniciar').style.display = 'none';
        
        function proximo() {
            if(i < sequencia.length) {
                tocarVogal(sequencia[i]);
                player.onended = () => { i++; setTimeout(proximo, 500); };
            } else {
                feedback.innerText = "Muito bem! Agora tente ligar as letras!";
                document.getElementById('btnProxima').style.display = 'inline-block';
            }
        }
        proximo();
    }

    // Lógica do Jogo de Ligação
    let escolhaLetra = null;
    let escolhaFigura = null;

    function irParaJogo() {
        document.getElementById('area-apresentacao').style.display = 'none';
        document.getElementById('btnProxima').style.display = 'none';
        document.getElementById('area-jogo').style.display = 'grid';
        feedback.innerText = "Ligue a letra na figura certa!";
    }

    function selecionarItem(el, tipo, valor) {
        if(el.classList.contains('correto')) return;

        if(tipo === 'letra') {
            if(escolhaLetra) escolhaLetra.el.classList.remove('selecionado');
            escolhaLetra = { el, valor };
        } else {
            if(escolhaFigura) escolhaFigura.el.classList.remove('selecionado');
            escolhaFigura = { el, valor };
        }
        el.classList.add('selecionado');

        if(escolhaLetra && escolhaFigura) {
            if(escolhaLetra.valor === escolhaFigura.valor) {
                escolhaLetra.el.classList.add('correto');
                escolhaFigura.el.classList.add('correto');
                feedback.innerText = "Isso mesmo! " + valor + " de " + valor;
                ouvirLetra('acerto.mp3'); // Opcional
            } else {
                feedback.innerText = "Ops! Tente de novo!";
                const l = escolhaLetra.el; const f = escolhaFigura.el;
                setTimeout(() => { l.classList.remove('selecionado'); f.classList.remove('selecionado'); }, 500);
            }
            escolhaLetra = null; escolhaFigura = null;
        }
    }

    function toggleTheme() {
        const b = document.body;
        const isDark = b.getAttribute('data-theme') === 'dark';
        b.setAttribute('data-theme', isDark ? 'light' : 'dark');
        document.getElementById('btnTema').innerText = isDark ? '☀️' : '🌙';
    }
</script>
</body>
</html>
