<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Jornada das Letras: Vogais Minúsculas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Nunito:wght@400;600;700;800&family=Fredoka+One&family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════
   DESIGN: "Folha de Caderno Viva" — Paper Craft Escolar
═══════════════════════════════════════════════════════ */
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --coral: #f4845f; --coral-dark: #e05a3a;
  --turquoise: #4dd0e1; --turquoise-dark: #26a8b8;
  --lavender: #b39ddb; --lavender-dark: #8e79c0;
  --lime: #aed581; --lime-dark: #8bc34a;
  --peach: #ffab91; --peach-dark: #e08060;
  --paper: #fefcf3; --brown: #5d4037; --brown-light: #795548;
  --ruled-line: rgba(173, 200, 230, 0.25);
  --margin-line: rgba(200, 100, 100, 0.2);
}
body {
  font-family: 'Nunito', sans-serif;
  background: var(--paper);
  color: #333;
  min-height: 100vh;
  position: relative;
  overflow-x: hidden;
}
body::before {
  content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background: repeating-linear-gradient(0deg, transparent, transparent 31px, var(--ruled-line) 31px, var(--ruled-line) 32px);
  background-size: 100% 32px; background-position: 0 16px;
}
body::after {
  content: ''; position: fixed; top: 0; bottom: 0; left: clamp(40px, 8vw, 80px); width: 2px;
  background: var(--margin-line); z-index: 0; pointer-events: none;
}

/* ─── Header fixo ─── */
.header {
  position: sticky; top: 0; z-index: 50; background: rgba(254, 252, 243, 0.92);
  backdrop-filter: blur(12px); border-bottom: 1px solid rgba(180, 200, 220, 0.3);
}
.header-inner { max-width: 800px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; }
.btn-voltar {
  display: flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 50px; border: none;
  font-size: 13px; font-weight: 800; font-family: 'Nunito', sans-serif; background: #e0e0e0; color: #424242;
  box-shadow: 0 3px 0 #bdbdbd; cursor: pointer; text-decoration: none; transition: transform 0.15s;
}
.btn-voltar:hover { transform: scale(1.05); }
.btn-voltar:active { transform: translateY(2px); box-shadow: 0 1px 0 #bdbdbd; }
.titulo-header { font-family: 'Patrick Hand', cursive; font-size: clamp(16px, 4vw, 22px); color: var(--brown); }

/* ─── Área principal ─── */
.stage { max-width: 700px; margin: 24px auto; padding: 0 16px; position: relative; z-index: 10; text-align: center; }
.instrucoes { font-family: 'Patrick Hand', cursive; font-size: 26px; color: var(--brown); margin-bottom: 8px; }
.sub-instrucoes { font-family: 'Nunito', sans-serif; font-size: 16px; color: var(--brown-light); margin-bottom: 32px; font-weight: 600; }

/* ─── GRID DE CARTAS 3D ─── */
.cards-grid {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 20px;
  perspective: 1000px; /* Cria a profundidade do 3D */
}

/* Contêiner da carta */
.card-container {
  width: 90px;
  height: 110px;
  cursor: pointer;
}

@media (min-width: 640px) {
  .card-container { width: 110px; height: 130px; }
}

/* O elemento que gira */
.card-flipper {
  width: 100%;
  height: 100%;
  position: relative;
  transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
  transform-style: preserve-3d;
}

/* Classe adicionada pelo JS para girar */
.card-container.girada .card-flipper {
  transform: rotateY(180deg);
}

/* Faces da carta */
.card-face {
  position: absolute;
  width: 100%;
  height: 100%;
  backface-visibility: hidden; /* Esconde as costas quando virado */
  border-radius: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Fredoka One', cursive;
  box-shadow: 0 6px 15px rgba(93, 64, 55, 0.15);
  border: 4px solid;
}

/* Frente (Post-it com interrogação) */
.card-front {
  background: #fff9c4; /* Amarelinho post-it */
  border-color: #fbc02d;
  color: #f57f17;
  font-size: 3rem;
}

.card-front::after {
  content: '?';
}

/* Costas (A letra minúscula revelada) */
.card-back {
  transform: rotateY(180deg); /* Já começa virado pra trás */
  font-size: 4rem;
  color: #fff;
}

/* Cores específicas para as costas de cada letra */
.card-back.cor-a { background: var(--coral); border-color: var(--coral-dark); }
.card-back.cor-e { background: var(--turquoise); border-color: var(--turquoise-dark); }
.card-back.cor-i { background: var(--lavender); border-color: var(--lavender-dark); }
.card-back.cor-o { background: var(--lime); border-color: var(--lime-dark); }
.card-back.cor-u { background: var(--peach); border-color: var(--peach-dark); }

/* Animação extra quando a carta abre */
@keyframes popCard {
  0% { transform: scale(1) rotateY(180deg); }
  50% { transform: scale(1.15) rotateY(180deg); }
  100% { transform: scale(1) rotateY(180deg); }
}
.card-container.girada .card-flipper {
  animation: popCard 0.5s ease forwards;
}

.btn-reset {
  margin-top: 40px; padding: 12px 24px; border-radius: 50px; border: none; font-family: 'Fredoka One', cursive;
  font-size: 16px; background: #e3f2fd; color: #1565c0; cursor: pointer; box-shadow: 0 4px 0 #bbdefb; transition: transform 0.1s;
}
.btn-reset:active { transform: translateY(4px); box-shadow: 0 0 0 #bbdefb; }

</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <a href="vogais.html" class="btn-voltar">⬅️ VOLTAR</a>
    <span class="titulo-header">Vogais Minúsculas</span>
    <div style="width: 80px;"></div>
  </div>
</header>

<div class="stage">
  <h2 class="instrucoes">Esconde-Esconde!</h2>
  <p class="sub-instrucoes">Toque nos cartões para revelar as letrinhas minúsculas.</p>

  <div class="cards-grid">

    <div class="card-container" onclick="revelarCarta(this, 'a')">
      <div class="card-flipper">
        <div class="card-face card-front"></div>
        <div class="card-face card-back cor-a">a</div>
      </div>
    </div>

    <div class="card-container" onclick="revelarCarta(this, 'e')">
      <div class="card-flipper">
        <div class="card-face card-front"></div>
        <div class="card-face card-back cor-e">e</div>
      </div>
    </div>

    <div class="card-container" onclick="revelarCarta(this, 'i')">
      <div class="card-flipper">
        <div class="card-face card-front"></div>
        <div class="card-face card-back cor-i">i</div>
      </div>
    </div>

    <div class="card-container" onclick="revelarCarta(this, 'o')">
      <div class="card-flipper">
        <div class="card-face card-front"></div>
        <div class="card-face card-back cor-o">o</div>
      </div>
    </div>

    <div class="card-container" onclick="revelarCarta(this, 'u')">
      <div class="card-flipper">
        <div class="card-face card-front"></div>
        <div class="card-face card-back cor-u">u</div>
      </div>
    </div>

  </div>

  <button class="btn-reset" onclick="esconderTodas()">🔄 Esconder todas de novo</button>
</div>

<script>
// Reaproveitando os áudios que você já possui
const audios = {
  a: new Audio('vogal_a.ogg'),
  e: new Audio('vogal_e.ogg'),
  i: new Audio('vogal_i.ogg'),
  o: new Audio('vogal_o.ogg'),
  u: new Audio('vogal_u.ogg')
};

// Quando clica na carta
function revelarCarta(elemento, letra) {
  // Se a carta já estiver girada, não faz nada
  if (elemento.classList.contains('girada')) return;

  // Adiciona a classe que faz o CSS girar a carta
  elemento.classList.add('girada');

  // Toca o áudio da vogal correspondente
  if (audios[letra]) {
    audios[letra].currentTime = 0;
    audios[letra].play().catch(e => console.log("Áudio bloqueado", e));
  }
}

// Botão para virar as cartas de volta e recomeçar a brincadeira
function esconderTodas() {
  const cartas = document.querySelectorAll('.card-container');
  cartas.forEach(carta => {
    carta.classList.remove('girada');
  });
}
</script>

</body>
</html>
