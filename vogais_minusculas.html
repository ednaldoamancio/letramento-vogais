<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Jornada das Letras: Vogais Minúsculas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Nunito:wght@400;600;700;800&family=Fredoka+One&family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════
   DESIGN: "Folha de Caderno Viva" — Paper Craft Escolar
═══════════════════════════════════════════════════════ */
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --coral: #f4845f; --coral-dark: #e05a3a;
  --turquoise: #4dd0e1; --turquoise-dark: #26a8b8;
  --lavender: #b39ddb; --lavender-dark: #8e79c0;
  --lime: #aed581; --lime-dark: #8bc34a;
  --peach: #ffab91; --peach-dark: #e08060;
  --paper: #fefcf3; --brown: #5d4037; --brown-light: #795548;
  --ruled-line: rgba(173, 200, 230, 0.25);
  --margin-line: rgba(200, 100, 100, 0.2);
}
body {
  font-family: 'Nunito', sans-serif;
  background: var(--paper);
  color: #333;
  min-height: 100vh;
  position: relative;
  overflow-x: hidden;
}
body::before {
  content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background: repeating-linear-gradient(0deg, transparent, transparent 31px, var(--ruled-line) 31px, var(--ruled-line) 32px);
  background-size: 100% 32px; background-position: 0 16px;
}
body::after {
  content: ''; position: fixed; top: 0; bottom: 0; left: clamp(40px, 8vw, 80px); width: 2px;
  background: var(--margin-line); z-index: 0; pointer-events: none;
}

/* ─── Header fixo ─── */
.header { position: sticky; top: 0; z-index: 50; background: rgba(254, 252, 243, 0.92); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(180, 200, 220, 0.3); }
.header-inner { max-width: 800px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; }
.btn-voltar { display: flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 50px; border: none; font-size: 13px; font-weight: 800; font-family: 'Nunito', sans-serif; background: #e0e0e0; color: #424242; box-shadow: 0 3px 0 #bdbdbd; cursor: pointer; text-decoration: none; transition: transform 0.15s; }
.btn-voltar:hover { transform: scale(1.05); }
.btn-voltar:active { transform: translateY(2px); box-shadow: 0 1px 0 #bdbdbd; }
.titulo-header { font-family: 'Patrick Hand', cursive; font-size: clamp(16px, 4vw, 22px); color: var(--brown); }

/* ─── Área principal ─── */
.stage { max-width: 700px; margin: 24px auto; padding: 0 16px; position: relative; z-index: 10; text-align: center; }
.instrucoes { font-family: 'Patrick Hand', cursive; font-size: 26px; color: var(--brown); margin-bottom: 8px; }
.sub-instrucoes { font-family: 'Nunito', sans-serif; font-size: 16px; color: var(--brown-light); margin-bottom: 32px; font-weight: 600; }

/* ─── GRID DE CARTAS 3D ─── */
.cards-grid { display: flex; justify-content: center; flex-wrap: wrap; gap: 20px; perspective: 1000px; }
.card-container { width: 90px; height: 110px; cursor: pointer; }
@media (min-width: 640px) { .card-container { width: 110px; height: 130px; } }

.card-flipper { width: 100%; height: 100%; position: relative; transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1); transform-style: preserve-3d; }
.card-container.girada .card-flipper { transform: rotateY(180deg); }

.card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-family: 'Fredoka One', cursive; box-shadow: 0 6px 15px rgba(93, 64, 55, 0.15); border: 4px solid; }
.card-front { background: #fff9c4; border-color: #fbc02d; color: #f57f17; font-size: 3rem; }
.card-front::after { content: '?'; }
.card-back { transform: rotateY(180deg); font-size: 4rem; color: #fff; }

.card-back.cor-a { background: var(--coral); border-color: var(--coral-dark); }
.card-back.cor-e { background: var(--turquoise); border-color: var(--turquoise-dark); }
.card-back.cor-i { background: var(--lavender); border-color: var(--lavender-dark); }
.card-back.cor-o { background: var(--lime); border-color: var(--lime-dark); }
.card-back.cor-u { background: var(--peach); border-color: var(--peach-dark); }

@keyframes popCard { 0% { transform: scale(1) rotateY(180deg); } 50% { transform: scale(1.15) rotateY(180deg); } 100% { transform: scale(1) rotateY(180deg); } }
.card-container.girada .card-flipper { animation: popCard 0.5s ease forwards; }

.btn-reset { margin-top: 40px; padding: 12px 24px; border-radius: 50px; border: none; font-family: 'Fredoka One', cursive; font-size: 16px; background: #e3f2fd; color: #1565c0; cursor: pointer; box-shadow: 0 4px 0 #bbdefb; transition: transform 0.1s; }
.btn-reset:active { transform: translateY(4px); box-shadow: 0 0 0 #bbdefb; }

/* ─── MODAL DE VÍDEO RECOMPENSA ─── */
.video-modal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.85); z-index: 9999; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.3s ease; }
.video-modal.visivel { display: flex; opacity: 1; }
.video-modal-content { position: relative; width: 90%; max-width: 500px; background: #fff; padding: 12px; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); animation: popModal 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
@keyframes popModal { 0% { transform: scale(0.6); } 100% { transform: scale(1); } }
.video-recompensa { width: 100%; border-radius: 12px; border: 4px dashed rgba(121, 85, 72, 0.3); display: block; background: #000; }
.btn-fechar-video { position: absolute; top: -15px; right: -15px; width: 45px; height: 45px; border-radius: 50%; background: var(--coral-dark); color: white; border: 4px solid #fff; font-family: 'Fredoka One', cursive; font-size: 20px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.3); z-index: 10; }
.btn-fechar-video:active { transform: scale(0.9); }

</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <a href="vogais.html" class="btn-voltar">⬅️ VOLTAR</a>
    <span class="titulo-header">Vogais Minúsculas</span>
    <div style="width: 80px;"></div>
  </div>
</header>

<div class="stage">
  <h2 class="instrucoes">Esconde-Esconde!</h2>
  <p class="sub-instrucoes" id="textoSub">Toque nos cartões para revelar as letrinhas minúsculas.</p>

  <div class="cards-grid">
    <div class="card-container" onclick="revelarCarta(this, 'a')">
      <div class="card-flipper"><div class="card-face card-front"></div><div class="card-face card-back cor-a">a</div></div>
    </div>
    <div class="card-container" onclick="revelarCarta(this, 'e')">
      <div class="card-flipper"><div class="card-face card-front"></div><div class="card-face card-back cor-e">e</div></div>
    </div>
    <div class="card-container" onclick="revelarCarta(this, 'i')">
      <div class="card-flipper"><div class="card-face card-front"></div><div class="card-face card-back cor-i">i</div></div>
    </div>
    <div class="card-container" onclick="revelarCarta(this, 'o')">
      <div class="card-flipper"><div class="card-face card-front"></div><div class="card-face card-back cor-o">o</div></div>
    </div>
    <div class="card-container" onclick="revelarCarta(this, 'u')">
      <div class="card-flipper"><div class="card-face card-front"></div><div class="card-face card-back cor-u">u</div></div>
    </div>
  </div>

  <button class="btn-reset" onclick="esconderTodas()">🔄 Esconder todas de novo</button>
</div>

<div id="videoModal" class="video-modal">
  <div class="video-modal-content">
    <button class="btn-fechar-video" onclick="fecharVideo()">X</button>
    <video id="videoRecompensa" class="video-recompensa" playsinline controls></video>
  </div>
</div>

<script>
const audios = {
  a: new Audio('vogal_a.ogg'), e: new Audio('vogal_e.ogg'),
  i: new Audio('vogal_i.ogg'), o: new Audio('vogal_o.ogg'),
  u: new Audio('vogal_u.ogg')
};

const videos = {
  a: 'a_de_aviao.mp4', e: 'e_de_elefante.mp4',
  i: 'i_de_iguana.mp4', o: 'o_de_de_ovo.mp4',
  u: 'u_de_unicornio.mp4'
};

const textoSub = document.getElementById('textoSub');

function revelarCarta(elemento, letra) {
  const cartasViradas = document.querySelectorAll('.card-container.girada').length;

  if (elemento.classList.contains('girada')) {
    if (cartasViradas === 5) {
      abrirVideoRecompensa(letra);
    }
    return; 
  }

  elemento.classList.add('girada');

  if (audios[letra]) {
    audios[letra].currentTime = 0;
    audios[letra].play().catch(e => console.log("Áudio bloqueado", e));
  }

  const totalAgora = document.querySelectorAll('.card-container.girada').length;
  if (totalAgora === 5) {
    textoSub.innerHTML = "✨ <b>Parabéns!</b> Agora toque nas letrinhas para ver a mágica!";
    textoSub.style.color = "#e05a3a"; 
  }
}

function abrirVideoRecompensa(letra) {
  const modal = document.getElementById('videoModal');
  const video = document.getElementById('videoRecompensa');

  // Prepara o vídeo e abre o modal
  video.src = videos[letra];
  
  // Força o navegador de celular a "entender" que o arquivo carregou antes de tentar tocar
  video.load(); 
  modal.classList.add('visivel');
  
  // Tenta rodar o vídeo automaticamente
  let playPromise = video.play();
  
  if (playPromise !== undefined) {
    playPromise.then(() => {
      // Se deu certo, não faz nada
    }).catch(error => {
      // Se o celular bloqueou (como no seu Edge), o vídeo vai ficar na tela esperando a criança apertar o botão de Play que nós adicionamos!
      console.log("Navegador bloqueou o autoplay. O usuário precisará clicar no Play.", error);
    });
  }

  video.onended = () => {
    fecharVideo();
  };
}

function fecharVideo() {
  const modal = document.getElementById('videoModal');
  const video = document.getElementById('videoRecompensa');
  video.pause();
  modal.classList.remove('visivel');
}

function esconderTodas() {
  const cartas = document.querySelectorAll('.card-container');
  cartas.forEach(carta => {
    carta.classList.remove('girada');
  });
  
  textoSub.innerHTML = "Toque nos cartões para revelar as letrinhas minúsculas.";
  textoSub.style.color = "var(--brown-light)";
}
</script>

</body>
</html>
