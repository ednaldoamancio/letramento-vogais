<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu de Números - Aprendizado Gamer</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Nunito', sans-serif; background: #fefcf3; text-align: center; padding: 20px; color: #5d4037; }
        .hub-container { max-width: 800px; margin: 0 auto; }
        h1 { font-family: 'Fredoka One', cursive; font-size: 3rem; margin-bottom: 40px; text-shadow: 2px 2px 0px #fff; }
        .grid-menu { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 25px; }
        .card-aula {
            background: white; border-radius: 25px; padding: 30px; border: 4px solid #795548;
            text-decoration: none; color: inherit; transition: all 0.3s;
            box-shadow: 0 10px 0 #795548; display: flex; flex-direction: column; align-items: center;
        }
        .card-aula:hover { transform: translateY(-10px); box-shadow: 0 15px 0 #795548; }
        .card-aula:active { transform: translateY(5px); box-shadow: 0 2px 0 #795548; }
        .icon { font-size: 60px; margin-bottom: 15px; }
        .card-title { font-family: 'Fredoka One'; font-size: 20px; margin-bottom: 10px; }
        .card-desc { font-size: 14px; opacity: 0.8; }
    </style>
</head>
<body>
    <div class="hub-container">
        <h1>🔢 Reino dos Números</h1>
        <div class="grid-menu">
            <a href="aprender_contar.html" class="card-aula" style="border-color: #f4845f;">
                <div class="icon">📖</div>
                <div class="card-title">1. Conte de 0 a 10</div>
                <div class="card-desc">Clique nos números para ver e ouvir as quantidades.</div>
            </a>
            <a href="desafio_quanto_tem.html" class="card-aula" style="border-color: #4dd0e1;">
                <div class="icon">🎯</div>
                <div class="card-title">2. Quanto tem aqui?</div>
                <div class="card-desc">Conte os desenhos e escolha o número certo.</div>
            </a>
            <a href="jogo_transformar.html" class="card-aula" style="border-color: #aed581;">
                <div class="icon">🎨</div>
                <div class="card-title">3. Fábrica de Quantidades</div>
                <div class="card-desc">Arraste os itens para formar o número pedido!</div>
            </a>
        </div>
        <br><br>
        <a href="index.html" style="font-weight: bold; color: #795548;">⬅ Voltar ao Início</a>
    </div>
</body>
</html>
