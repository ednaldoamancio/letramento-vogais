<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
    <title>Jornada das Letras: Números e Quantidades</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Nunito:wght@400;600;700;800&family=Fredoka+One&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --coral: #f4845f; --turquoise: #4dd0e1; --lavender: #b39ddb; --lime: #aed581; --peach: #ffab91;
            --paper: #fefcf3; --brown: #5d4037; --brown-light: #795548;
            --ruled-line: rgba(173, 200, 230, 0.25); --margin-line: rgba(200, 100, 100, 0.2);
        }
        body {
            font-family: 'Nunito', sans-serif; background: var(--paper); color: #333;
            min-height: 100vh; position: relative; overflow-x: hidden;
        }
        body::before {
            content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
            background: repeating-linear-gradient(0deg, transparent, transparent 31px, var(--ruled-line) 31px, var(--ruled-line) 32px);
            background-size: 100% 32px; background-position: 0 16px;
        }
        body::after {
            content: ''; position: fixed; top: 0; bottom: 0; left: clamp(40px, 8vw, 80px); width: 2px;
            background: var(--margin-line); z-index: 0; pointer-events: none;
        }
        .header { position: sticky; top: 0; z-index: 50; background: rgba(254, 252, 243, 0.92); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(180, 200, 220, 0.3); }
        .header-inner { max-width: 900px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; }
        .titulo-header { font-family: 'Patrick Hand', cursive; font-size: 20px; color: var(--brown); }
        
        .stage { max-width: 800px; margin: 24px auto; padding: 0 16px; position: relative; z-index: 10; text-align: center; }
        .instrucoes { font-family: 'Patrick Hand', cursive; font-size: 24px; color: var(--brown); margin-bottom: 16px; }
        
        .nav-numeros { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-bottom: 32px; }
        .btn-num {
            width: 50px; height: 50px; border-radius: 12px; border: 2px solid var(--brown-light);
            font-family: 'Fredoka One', cursive; font-size: 24px; color: var(--brown);
            background: #fff; cursor: pointer; transition: all 0.15s;
            box-shadow: 0 4px 0 rgba(93, 64, 55, 0.2);
        }
        .btn-num.ativo { background: var(--turquoise); color: #fff; transform: translateY(2px); box-shadow: none; }
        
        .display-container { display: flex; flex-direction: column; gap: 24px; align-items: center; justify-content: center; }
        @media (min-width: 768px) { .display-container { flex-direction: row; align-items: flex-start; } }
        
        .numero-grande-card {
            background: #fff; border: 3px solid var(--brown-light); border-radius: 24px;
            width: 140px; height: 180px; display: flex; align-items: center; justify-content: center;
            font-family: 'Fredoka One', cursive; font-size: 80px; color: var(--coral);
            box-shadow: 6px 6px 0 rgba(93, 64, 55, 0.15); transform: rotate(-2deg);
        }
        
        .quantidade-box {
            flex: 1; min-height: 180px; background: rgba(255,255,255,0.6);
            border: 3px dashed var(--ruled-line); border-radius: 24px; padding: 24px;
            display: flex; flex-wrap: wrap; justify-content: center; align-content: center; gap: 12px; max-width: 500px;
        }
        
        .item-adesivo { font-size: 45px; opacity: 0; transform: scale(0.5); }
        .aparecer { animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
        @keyframes popIn { to { opacity: 1; transform: scale(1); } }

        /* --- CORREÇÃO DA ANIMAÇÃO DO GRAN FINALE --- */
        .confete {
            position: fixed; top: -20px;
            width: 12px; height: 12px;
            z-index: 999;
            pointer-events: none;
            animation: queda linear forwards;
        }
        @keyframes queda {
            to { transform: translateY(110vh) rotate(720deg); }
        }
    </style>
</head>
<body>

<header class="header">
    <div class="header-inner">
        <span class="titulo-header">🔢 Jornada dos Números (Vozes: Pietro & Giovanna)</span>
    </div>
</header>

<div class="stage">
    <h2 class="instrucoes">Toque em um número para contar!</h2>
    <div class="nav-numeros" id="navNumeros"></div>

    <div class="display-container">
        <div class="numero-grande-card" id="numDisplay">?</div>
        <div class="quantidade-box" id="qtdBox">
            <p class="msg-zero">Clique em um número para começar!</p>
        </div>
    </div>
</div>

<script>
    const temasNumeros = {
        0: { emoji: "📭", cor: "#9e9e9e" },
        1: { emoji: "🍎", cor: "var(--coral)" },
        2: { emoji: "🦆", cor: "var(--turquoise)" },
        3: { emoji: "⭐", cor: "var(--lime)" },
        4: { emoji: "🐸", cor: "#4caf50" },
        5: { emoji: "🖐️", cor: "var(--peach)" },
        6: { emoji: "🐞", cor: "#f44336" },
        7: { emoji: "✏️", cor: "#ff9800" },
        8: { emoji: "🦋", cor: "var(--lavender)" },
        9: { emoji: "🎈", cor: "#e91e63" },
        10: { emoji: "⚽", cor: "#3f51b5" }
    };

    const navContainer = document.getElementById('navNumeros');
    const numDisplay = document.getElementById('numDisplay');
    const qtdBox = document.getElementById('qtdBox');
    
    let contagemEmAndamento = false;
    let proximoNumeroEsperado = 0; 

    for (let i = 0; i <= 10; i++) {
        const btn = document.createElement('button');
        btn.className = 'btn-num';
        btn.innerText = i;
        btn.onclick = () => selecionarNumero(i, btn);
        navContainer.appendChild(btn);
    }

    async function selecionarNumero(numero, btnClicado) {
        if (contagemEmAndamento) return;
        contagemEmAndamento = true;

        // Lógica da Sequência (0 -> 1 -> 2...)
        if (numero === proximoNumeroEsperado) {
            proximoNumeroEsperado++;
        } else {
            // Se errar a ordem, reseta. Se clicar no zero, recomeça a trilha do zero.
            proximoNumeroEsperado = (numero === 0) ? 1 : 0;
        }

        document.querySelectorAll('.btn-num').forEach(b => b.classList.remove('ativo'));
        btnClicado.classList.add('ativo');
        numDisplay.innerText = numero;
        numDisplay.style.color = temasNumeros[numero].cor;
        qtdBox.innerHTML = '';

        // 1. Ouvir o número do botão (Voz da Giovanna)
        await tocarAudio(`numero_${numero}.mp3`);
        await new Promise(r => setTimeout(r, 600));

        // 2. Contagem quantitativa
        if (numero === 0) {
            qtdBox.innerHTML = `<div class="msg-zero" style="color:#795548; font-family:'Patrick Hand'">Vazio! É zero.</div>`;
        } else {
            for (let i = 1; i <= numero; i++) {
                const item = document.createElement('div');
                item.classList.add('item-adesivo');
                item.innerText = temasNumeros[numero].emoji;
                qtdBox.appendChild(item);
                await tocarAudioComEfeito(`numero_${i}.mp3`, item);
            }
        }

        // --- DISPARO DA FESTA ---
        if (numero === 10 && proximoNumeroEsperado === 11) {
            // Espera meio segundo após a Giovanna terminar de falar "Dez"
            setTimeout(festejar, 500); 
            proximoNumeroEsperado = 0; 
        }
        
        contagemEmAndamento = false;
    }

    function tocarAudio(arquivo) {
        return new Promise((resolve) => {
            const audio = new Audio(arquivo);
            audio.onended = resolve;
            audio.onerror = resolve;
            audio.play().catch(resolve);
        });
    }

    function tocarAudioComEfeito(arquivo, elemento) {
        return new Promise((resolve) => {
            const audio = new Audio(arquivo);
            audio.onplay = () => elemento.classList.add('aparecer');
            audio.onended = () => setTimeout(resolve, 200);
            audio.onerror = () => { elemento.classList.add('aparecer'); resolve(); };
            audio.play().catch(resolve);
        });
    }

    function festejar() {
        // Toca som de vitória (festa.mp3)
        const festaAudio = new Audio('festa.mp3'); 
        festaAudio.play().catch(() => console.log("Faltou o arquivo festa.mp3 para os aplausos!"));

        // Chuva de confetes
        for (let i = 0; i < 120; i++) {
            const confete = document.createElement('div');
            confete.className = 'confete';
            
            // Posição e cores aleatórias
            confete.style.left = Math.random() * 100 + 'vw';
            confete.style.backgroundColor = `hsl(${Math.random() * 360}, 100%, 50%)`;
            
            // Formatos variados (quadrado ou círculo)
            if(Math.random() > 0.5) confete.style.borderRadius = '50%';
            
            // Velocidade e atraso aleatórios
            const duracao = Math.random() * 2 + 3;
            const atraso = Math.random() * 2;
            confete.style.animationDuration = duracao + 's';
            confete.style.animationDelay = atraso + 's';
            
            document.body.appendChild(confete);

            // Limpeza
            setTimeout(() => confete.remove(), (duracao + atraso) * 1000);
        }
    }
</script>
</body>
</html>
