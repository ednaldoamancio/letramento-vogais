<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
    <title>Fábrica de Quantidades - Giovanna</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --primary: #0097a7; --secondary: #ff5722; --bg: #e0f7fa; 
            --card-bg: #ffffff; --text: #333333; --transition: 0.4s;
        }
        body.dark-mode {
            --bg: #1a1a2e; --card-bg: #16213e; --text: #ffffff; --primary: #4dd0e1;
        }

        body { 
            font-family: 'Nunito', sans-serif; background: var(--bg); color: var(--text);
            text-align: center; margin: 0; padding: 0; transition: var(--transition);
            height: 100vh; height: 100dvh; overflow: hidden;
            display: flex; flex-direction: column;
        }

        .header-tools { padding: 8px; display: flex; justify-content: space-between; align-items: center; z-index: 100; }
        .btn-theme { background: none; border: none; font-size: 24px; cursor: pointer; }
        
        .painel-progresso { font-size: 24px; }
        .medalha { opacity: 0.2; filter: grayscale(1); transition: 0.5s; display: inline-block; }
        .medalha.ganha { opacity: 1; filter: grayscale(0); transform: scale(1.2); }

        .container { flex: 1; display: flex; flex-direction: column; justify-content: space-evenly; align-items: center; padding: 5px; }

        .painel-alvo {
            background: var(--card-bg); border: 4px solid var(--primary); border-radius: 20px;
            padding: 10px 30px; box-shadow: 0 6px 0 rgba(0,0,0,0.1);
        }
        .numero-pedida { font-family: 'Fredoka One'; font-size: 80px; color: var(--primary); margin: 0; line-height: 1; }

        #caixa-deposito {
            width: 90%; max-width: 450px; min-height: 150px; 
            background: rgba(255,255,255,0.3); border: 4px dashed var(--primary);
            border-radius: 25px; display: flex; flex-wrap: wrap; 
            align-items: center; justify-content: center; padding: 15px; gap: 8px;
        }

        .dispensador {
            background: var(--card-bg); padding: 10px 20px; 
            border-radius: 40px; display: flex; gap: 20px; border: 3px solid var(--primary);
        }
        .item-arrastavel { font-size: 50px; cursor: pointer; transition: 0.2s; user-select: none; }
        .item-arrastavel:active { transform: scale(0.8); }

        .btn-conferir {
            padding: 15px 50px; border-radius: 50px; border: none;
            background: var(--secondary); color: white; font-family: 'Fredoka One'; 
            font-size: 24px; cursor: pointer; box-shadow: 0 6px 0 #bf360c;
        }

        #modal-presente {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95);
            z-index: 2000; flex-direction: column; align-items: center; justify-content: center;
        }
        .video-box { width: 90%; aspect-ratio: 16/9; border: 5px solid gold; border-radius: 15px; overflow: hidden; }

        .confete { 
            position: fixed; z-index: 1000; pointer-events: none; 
            animation: cair linear forwards;
        }
        @keyframes cair { 
            0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
        }
    </style>
</head>
<body>

<div class="header-tools">
    <a href="index.html" style="text-decoration:none; font-size: 20px;">🏠</a>
    <div class="painel-progresso">
        <span class="medalha">⭐</span> <span class="medalha">⭐</span> <span class="medalha">⭐</span>
    </div>
    <button class="btn-theme" onclick="toggleTheme()" id="themeIcon">🌙</button>
</div>

<div class="container">
    <div class="painel-alvo">
        <p style="margin:0; font-family:'Nunito'; font-weight:bold;">Giovanna, coloque:</p>
        <h1 class="numero-pedida" id="numAlvo">?</h1>
    </div>

    <div id="caixa-deposito"></div>

    <div class="dispensador">
        <div class="item-arrastavel" onclick="adicionarItem('🍎')">🍎</div>
        <div class="item-arrastavel" onclick="adicionarItem('⚽')">⚽</div>
        <div class="item-arrastavel" onclick="adicionarItem('🎁')">🎁</div>
    </div>

    <button class="btn-conferir" onclick="verificarAcerto()">CONFERIR! ✨</button>
</div>

<div id="modal-presente">
    <h1 style="color:gold; font-family:'Fredoka One'; font-size: 24px; margin-bottom: 10px;">🎁 VOCÊ É DEMAIS! 🎁</h1>
    <div class="video-box" id="areaVideo"></div>
    <button onclick="fecharPresente()" style="margin-top:20px; padding:12px 30px; font-family:'Fredoka One'; cursor:pointer; border-radius:15px; border:none; background:white;">✖ VOLTAR</button>
</div>

<script>
    let numeroAlvo = 0;
    let acertosSeguidos = 0;
    const IDs_YOUTUBE = ["DhEpqf2tDJw", "mJYQ1zRzqo0", "YlBdVa8QA00"];

    function toggleTheme() {
        const isDark = document.body.classList.toggle('dark-mode');
        document.getElementById('themeIcon').innerText = isDark ? '☀️' : '🌙';
    }

    function novoDesafio() {
        numeroAlvo = Math.floor(Math.random() * 10) + 1;
        document.getElementById('numAlvo').innerText = numeroAlvo;
        document.getElementById('caixa-deposito').innerHTML = '';
        tocarSom(`numero_${numeroAlvo}.mp3`);
    }

    function adicionarItem(emoji) {
        const totalAtual = document.getElementById('caixa-deposito').children.length;
        
        if (totalAtual >= 15) return; // Limite visual

        const novoItem = document.createElement('div');
        novoItem.innerText = emoji;
        novoItem.style.fontSize = 'clamp(40px, 12vw, 60px)';
        novoItem.style.cursor = 'pointer';
        novoItem.style.animation = 'popIn 0.3s cubic-bezier(0.3, 1.5, 0.5, 1)';
        
        novoItem.onclick = function() { 
            this.remove(); 
            lancarConfetes(1); // Um confetinho ao tirar
        };

        document.getElementById('caixa-deposito').appendChild(novoItem);
        
        // Sonorização progressiva (Giovanna contando)
        const novaContagem = document.getElementById('caixa-deposito').children.length;
        tocarSom(`numero_${novaContagem}.mp3`);
        
        // Um confete cai cada vez que ela adiciona um item
        lancarConfetes(1);
    }

    async function verificarAcerto() {
        const totalNaCaixa = document.getElementById('caixa-deposito').children.length;
        
        if (totalNaCaixa === numeroAlvo) {
            await tocarSom(`numero_${numeroAlvo}.mp3`);
            lancarConfetes(30);
            await tocarSom('aplausos.ogg');
            
            acertosSeguidos++;
            atualizarMedalhas();

            if (acertosSeguidos >= 3) {
                setTimeout(ganharPresente, 800);
            } else {
                setTimeout(novoDesafio, 2500);
            }
        } else {
            await tocarSom('erro.ogg');
            // Feedback visual de erro
            document.getElementById('caixa-deposito').animate([
                { borderColor: 'red' }, { borderColor: 'var(--primary)' }
            ], { duration: 500 });
        }
    }

    function atualizarMedalhas() {
        const medalhas = document.querySelectorAll('.medalha');
        medalhas.forEach((m, idx) => { if(idx < acertosSeguidos) m.classList.add('ganha'); });
    }

    function lancarConfetes(qtd) {
        const cores = ['#ff0', '#f0f', '#0ff', '#f00', '#0f0', '#ff8c00'];
        for (let i = 0; i < qtd; i++) {
            const c = document.createElement('div');
            c.className = 'confete';
            c.style.left = Math.random() * 100 + 'vw';
            c.style.backgroundColor = cores[Math.floor(Math.random() * cores.length)];
            c.style.width = '8px'; c.style.height = '8px';
            const dur = (Math.random() * 2 + 1) + 's';
            c.style.animationDuration = dur;
            document.body.appendChild(c);
            setTimeout(() => c.remove(), 2500);
        }
    }

    function ganharPresente() {
        const idSorteado = IDs_YOUTUBE[Math.floor(Math.random() * IDs_YOUTUBE.length)];
        document.getElementById('areaVideo').innerHTML = `<iframe width="100%" height="100%" src="https://www.youtube.com/embed/${idSorteado}?autoplay=1" frameborder="0" allow="autoplay" allowfullscreen></iframe>`;
        document.getElementById('modal-presente').style.display = 'flex';
    }

    function fecharPresente() {
        document.getElementById('modal-presente').style.display = 'none';
        document.getElementById('areaVideo').innerHTML = '';
        acertosSeguidos = 0;
        document.querySelectorAll('.medalha').forEach(m => m.classList.remove('ganha'));
        novoDesafio();
    }

    function tocarSom(arq) {
        return new Promise(res => {
            const a = new Audio(arq);
            a.onended = res;
            a.onerror = res;
            a.play().catch(res);
        });
    }

    window.onload = novoDesafio;
</script>
</body>
</html>
