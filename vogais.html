<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
    <title>👸🤴 Reino das Vogais - Princesas e Príncipes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Nunito:wght@400;700;800&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --rosa-princesa: #e91e8c;
            --rosa-escuro: #9c1460;
            --rosa-claro: #ff80c0;
            --dourado-real: #d4a843;
            --dourado-branco: #fff8f0;
            --noite-real: #1a0a1e;
        }

        [data-theme="dark"] {
            --noite-real: #0d040f;
            --dourado-branco: #f0e0d0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; transition: background 0.3s, color 0.3s; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(180deg, #2d0a1e 0%, #1a0a1e 40%, #0d0418 100%);
            color: var(--dourado-branco);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Estrelas cintilantes no céu do reino */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background:
                radial-gradient(2px 2px at 15% 25%, #fff, transparent),
                radial-gradient(2px 2px at 35% 55%, rgba(255,200,220,0.8), transparent),
                radial-gradient(1px 1px at 55% 15%, #fff, transparent),
                radial-gradient(2px 2px at 75% 45%, rgba(255,180,200,0.6), transparent),
                radial-gradient(1px 1px at 85% 75%, #fff, transparent),
                radial-gradient(2px 2px at 25% 85%, rgba(255,200,220,0.7), transparent),
                radial-gradient(1px 1px at 65% 95%, #fff, transparent),
                radial-gradient(2px 2px at 45% 35%, rgba(255,180,200,0.5), transparent),
                radial-gradient(1px 1px at 95% 35%, #fff, transparent),
                radial-gradient(2px 2px at 5% 65%, rgba(255,200,220,0.6), transparent);
            background-size: 100% 100%;
            animation: cintilarEstrelas 3s ease-in-out infinite alternate;
        }

        @keyframes cintilarEstrelas {
            0% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        /* Corações flutuantes mágicos */
        .coracao-flutuante {
            position: fixed;
            pointer-events: none;
            z-index: 1;
            animation: flutuarCoracao linear infinite;
            opacity: 0.4;
            filter: drop-shadow(0 0 5px rgba(233, 30, 140, 0.5));
        }
        @keyframes flutuarCoracao {
            0% { transform: translateY(100vh) scale(0.5) rotate(0deg); opacity: 0; }
            15% { opacity: 0.6; }
            85% { opacity: 0.6; }
            100% { transform: translateY(-20vh) scale(1) rotate(20deg); opacity: 0; }
        }

        /* Header real */
        .header {
            position: sticky;
            top: 0;
            z-index: 50;
            background: linear-gradient(180deg, rgba(45,10,30,0.95) 0%, rgba(26,10,30,0.8) 100%);
            border-bottom: 2px solid var(--dourado-real);
            backdrop-filter: blur(10px);
        }
        .header-inner {
            max-width: 800px;
            margin: 0 auto;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-botoes { display: flex; gap: 10px; align-items: center; }

        .theme-toggle {
            background: linear-gradient(135deg, var(--dourado-real), #b8860b);
            border: 2px solid #fff;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
            box-shadow: 0 0 15px rgba(212, 168, 67, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }
        .theme-toggle:hover { transform: scale(1.1); box-shadow: 0 0 25px rgba(212, 168, 67, 0.6); }

        .btn-voltar {
            padding: 8px 16px;
            border-radius: 50px;
            border: 2px solid var(--dourado-real);
            font-weight: 800;
            background: rgba(212, 168, 67, 0.15);
            color: var(--dourado-real);
            text-decoration: none;
            font-size: 13px;
            font-family: 'Nunito', sans-serif;
            transition: all 0.3s;
        }
        .btn-voltar:hover {
            background: rgba(212, 168, 67, 0.3);
            box-shadow: 0 0 15px rgba(212, 168, 67, 0.3);
        }

        /* Stage principal */
        .stage {
            max-width: 700px;
            margin: 30px auto;
            padding: 0 16px;
            position: relative;
            z-index: 10;
        }
        .welcome {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 25px;
        }

        /* Título real */
        h2 {
            font-family: 'Cinzel Decorative', cursive;
            font-size: clamp(26px, 7vw, 38px);
            color: var(--dourado-real);
            text-shadow:
                0 0 15px rgba(233, 30, 140, 0.5),
                2px 2px 4px rgba(0,0,0,0.5);
            letter-spacing: 2px;
            position: relative;
        }
        h2::before, h2::after {
            content: "👑";
            font-size: 0.6em;
            margin: 0 10px;
            filter: drop-shadow(0 0 5px rgba(212, 168, 67, 0.5));
        }

        .subtitulo-real {
            font-family: 'Dancing Script', cursive;
            font-size: clamp(18px, 4vw, 24px);
            color: rgba(255, 255, 255, 0.7);
            margin-top: -15px;
        }

        /* Container dos botões */
        .menu-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 380px;
        }

        /* Cards reais */
        .btn-submenu {
            padding: 24px 18px;
            border-radius: 20px;
            border: none;
            font-family: 'Cinzel Decorative', cursive;
            font-size: clamp(18px, 5vw, 24px);
            color: #fff;
            text-decoration: none;
            text-align: center;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            letter-spacing: 1px;
        }

        .btn-submenu::before {
            content: "";
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.3s;
        }
        .btn-submenu:hover::before { opacity: 1; }

        .btn-submenu:hover {
            transform: translateY(-6px) scale(1.03);
        }
        .btn-submenu:active { transform: scale(0.95); }

        .btn-submenu span {
            font-size: 14px;
            font-family: 'Nunito', sans-serif;
            opacity: 0.9;
            font-weight: 700;
            letter-spacing: 0;
        }

        /* Vogais Maiúsculas - O Castelo Real */
        .btn-maiuscula {
            background: linear-gradient(145deg, #e91e8c, #9c1460);
            box-shadow:
                0 6px 0 #7a0f4a,
                0 0 20px rgba(233, 30, 140, 0.3),
                inset 0 1px 0 rgba(255,255,255,0.2);
            border: 2px solid rgba(255, 200, 220, 0.3);
        }
        .btn-maiuscula:hover {
            box-shadow:
                0 12px 0 #7a0f4a,
                0 0 40px rgba(233, 30, 140, 0.5),
                inset 0 1px 0 rgba(255,255,255,0.3);
        }

        /* Vogais Minúsculas - O Jardim Real */
        .btn-minuscula {
            background: linear-gradient(145deg, #ff80c0, #e91e8c);
            box-shadow:
                0 6px 0 #9c1460,
                0 0 20px rgba(255, 128, 192, 0.3),
                inset 0 1px 0 rgba(255,255,255,0.2);
            border: 2px solid rgba(255, 220, 240, 0.3);
        }
        .btn-minuscula:hover {
            box-shadow:
                0 12px 0 #9c1460,
                0 0 40px rgba(255, 128, 192, 0.5),
                inset 0 1px 0 rgba(255,255,255,0.3);
        }

        /* Palavrinhas - O Baile Real */
        .btn-palavrinhas {
            background: linear-gradient(145deg, #d4a843, #b8860b);
            box-shadow:
                0 6px 0 #8b6914,
                0 0 20px rgba(212, 168, 67, 0.3),
                inset 0 1px 0 rgba(255,255,255,0.2);
            border: 2px solid rgba(255, 240, 200, 0.3);
        }
        .btn-palavrinhas:hover {
            box-shadow:
                0 12px 0 #8b6914,
                0 0 40px rgba(212, 168, 67, 0.5),
                inset 0 1px 0 rgba(255,255,255,0.3);
        }

        /* Emoji decorativo */
        .emoji-real {
            font-size: 32px;
            margin-bottom: 5px;
            filter: drop-shadow(0 3px 6px rgba(0,0,0,0.4));
            transition: transform 0.3s;
        }
        .btn-submenu:hover .emoji-real {
            transform: scale(1.2) rotate(-5deg);
        }

        /* Decoração de castelo no rodapé */
        .decoracao-castelo {
            margin-top: 30px;
            font-size: 28px;
            opacity: 0.5;
            letter-spacing: 12px;
            text-align: center;
        }

        /* Responsivo */
        @media (max-width: 400px) {
            h2 { font-size: 22px; }
            h2::before, h2::after { margin: 0 5px; }
            .btn-submenu { padding: 20px 14px; }
            .emoji-real { font-size: 26px; }
        }
    </style>
<base target="_blank">
</head>
<body>

    <!-- Corações flutuantes (gerados via JS) -->
    <div id="coracoes-container"></div>

    <header class="header">
        <div class="header-inner">
            <a href="index.html" class="btn-voltar">⬅ VOLTAR</a>
            <div class="header-botoes">
                <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" aria-label="Mudar para modo noite ou dia">☀️</button>
            </div>
        </div>
    </header>

    <div class="stage">
        <div class="welcome">
            <h2>Reino das Vogais</h2>
            <p class="subtitulo-real">O reino das Princesas e Príncipes 👸🤴</p>

            <div class="menu-container">
                <a href="vogais_maiusculas.html" class="btn-submenu btn-maiuscula"
                   onmouseenter="tocarAudio('vogais_maiuscula.mp3')">
                    <span class="emoji-real">🏰</span>
                    A E I O U
                    <span>Vogais Maiúsculas</span>
                </a>

                <a href="vogais_minusculas.html" class="btn-submenu btn-minuscula"
                   onmouseenter="tocarAudio('vogais_minusculas.mp3')">
                    <span class="emoji-real">🌹</span>
                    a e i o u
                    <span>Vogais Minúsculas</span>
                </a>

                <a href="palavras_com_vogais.html" class="btn-submenu btn-palavrinhas"
                   onmouseenter="tocarAudio('formando_palavrinhas.mp3')">
                    <span class="emoji-real">💃🕺</span>
                    AO - EI - UI
                    <span>Formando Palavrinhas</span>
                </a>
            </div>

            <div class="decoracao-castelo">
                👑 🏰 🌹 💎 🏰 👑
            </div>
        </div>
    </div>

    <script>
        // Gerenciador de Áudio
        let somSubmenu;
        function tocarAudio(arquivo) {
            if (somSubmenu) {
                somSubmenu.pause();
                somSubmenu.currentTime = 0;
            }
            somSubmenu = new Audio(arquivo);
            somSubmenu.play().catch(e => console.log("Áudio aguardando interação."));
        }

        // Alternar Tema Noite/Dia
        function toggleTheme() {
            const body = document.body;
            const btn = document.getElementById('themeToggle');
            if (body.getAttribute('data-theme') === 'dark') {
                body.removeAttribute('data-theme');
                btn.innerHTML = '☀️';
            } else {
                body.setAttribute('data-theme', 'dark');
                btn.innerHTML = '🌙';
            }
        }

        // Corações flutuantes mágicos
        function criarCoracoes() {
            const container = document.getElementById('coracoes-container');
            const simbolos = ['💖', '💕', '💗', '💝', '✨', '🌟'];
            const cores = ['#e91e8c', '#ff80c0', '#d4a843', '#ff4081'];

            for (let i = 0; i < 12; i++) {
                setTimeout(() => {
                    const c = document.createElement('div');
                    c.className = 'coracao-flutuante';
                    c.innerText = simbolos[Math.floor(Math.random() * simbolos.length)];
                    c.style.left = Math.random() * 100 + '%';
                    c.style.fontSize = (Math.random() * 14 + 12) + 'px';
                    c.style.color = cores[Math.floor(Math.random() * cores.length)];
                    c.style.animationDuration = (Math.random() * 6 + 5) + 's';
                    c.style.animationDelay = (Math.random() * 4) + 's';
                    container.appendChild(c);

                    setTimeout(() => c.remove(), 11000);
                }, i * 500);
            }

            // Recriar corações periodicamente
            setInterval(() => {
                const c = document.createElement('div');
                c.className = 'coracao-flutuante';
                c.innerText = simbolos[Math.floor(Math.random() * simbolos.length)];
                c.style.left = Math.random() * 100 + '%';
                c.style.fontSize = (Math.random() * 14 + 12) + 'px';
                c.style.color = cores[Math.floor(Math.random() * cores.length)];
                c.style.animationDuration = (Math.random() * 6 + 5) + 's';
                container.appendChild(c);
                setTimeout(() => c.remove(), 11000);
            }, 2500);
        }

        window.onload = criarCoracoes;
    </script>

</body>
</html>
