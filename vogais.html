<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>👸🤴 Reino das Vogais - Aprenda as Vogais</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Nunito:wght@400;600;700;800&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --rosa-princesa: #e91e8c;
            --rosa-escuro: #9c1460;
            --rosa-claro: #ff80c0;
            --dourado-real: #d4a843;
            --dourado-escuro: #b8860b;
            --dourado-branco: #fff8f0;
            --noite-real: #1a0a1e;
            --verde-jardim: #2d8e5f;
            --coral: #f4845f;
            --turquoise: #4dd0e1;
            --lavender: #b39ddb;
            --lime: #aed581;
            --peach: #ffab91;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(180deg, #2d0a1e 0%, #1a0a1e 40%, #0d0418 100%);
            color: var(--dourado-branco);
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Estrelas cintilantes */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background:
                radial-gradient(2px 2px at 15% 25%, #fff, transparent),
                radial-gradient(2px 2px at 35% 55%, rgba(255,200,220,0.8), transparent),
                radial-gradient(1px 1px at 55% 15%, #fff, transparent),
                radial-gradient(2px 2px at 75% 45%, rgba(255,180,200,0.6), transparent),
                radial-gradient(1px 1px at 85% 75%, #fff, transparent),
                radial-gradient(2px 2px at 25% 85%, rgba(255,200,220,0.7), transparent),
                radial-gradient(1px 1px at 65% 95%, #fff, transparent),
                radial-gradient(2px 2px at 45% 35%, rgba(255,180,200,0.5), transparent),
                radial-gradient(1px 1px at 95% 35%, #fff, transparent),
                radial-gradient(2px 2px at 5% 65%, rgba(255,200,220,0.6), transparent);
            background-size: 100% 100%;
            animation: cintilarEstrelas 3s ease-in-out infinite alternate;
        }

        @keyframes cintilarEstrelas {
            0% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        /* Corações flutuantes */
        .coracao-flutuante {
            position: fixed;
            pointer-events: none;
            z-index: 1;
            animation: flutuarCoracao linear infinite;
            opacity: 0.4;
            filter: drop-shadow(0 0 5px rgba(233, 30, 140, 0.5));
        }
        
        @keyframes flutuarCoracao {
            0% { transform: translateY(100vh) scale(0.5) rotate(0deg); opacity: 0; }
            15% { opacity: 0.6; }
            85% { opacity: 0.6; }
            100% { transform: translateY(-20vh) scale(1) rotate(20deg); opacity: 0; }
        }

        /* Header */
        .header {
            position: relative;
            z-index: 50;
            background: linear-gradient(180deg, rgba(45,10,30,0.95) 0%, rgba(26,10,30,0.8) 100%);
            border-bottom: 2px solid var(--dourado-real);
            backdrop-filter: blur(10px);
        }
        
        .header-inner {
            max-width: 800px;
            margin: 0 auto;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
        }

        .header-botoes { display: flex; gap: 10px; align-items: center; }

        .btn-fullscreen {
            background: linear-gradient(135deg, #4a148c, #6a1b9a);
            border: 2px solid var(--dourado-real);
            width: 42px;
            height: 42px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            box-shadow: 0 0 10px rgba(212, 168, 67, 0.3);
            color: white;
        }
        
        .btn-fullscreen:hover {
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(212, 168, 67, 0.5);
            background: linear-gradient(135deg, #6a1b9a, #8e24aa);
        }
        
        .btn-fullscreen.ativo {
            background: linear-gradient(135deg, var(--dourado-real), #b8860b);
            box-shadow: 0 0 20px rgba(212, 168, 67, 0.6);
        }

        .btn-voltar-dourado {
            display: flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, var(--dourado-real), var(--dourado-escuro));
            border: 2px solid #fff;
            padding: 8px 20px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 800;
            font-family: 'Nunito', sans-serif;
            color: #1a0a2e;
            text-decoration: none;
            transition: all 0.3s;
            box-shadow: 0 0 15px rgba(212, 168, 67, 0.4);
            animation: brilhoDourado 1.5s ease-in-out infinite;
        }
        
        .btn-voltar-dourado:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(212, 168, 67, 0.8);
            background: linear-gradient(135deg, #e8c060, var(--dourado-real));
        }
        
        @keyframes brilhoDourado {
            0%, 100% { box-shadow: 0 0 15px rgba(212, 168, 67, 0.4); border-color: #fff; }
            50% { box-shadow: 0 0 30px rgba(212, 168, 67, 0.8); border-color: #ffe6a3; }
        }

        /* Stage - centralizado sem rolagem */
        .stage {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 15px;
            position: relative;
            z-index: 10;
            overflow: hidden;
        }

        .conteudo-central {
            max-width: 700px;
            width: 100%;
            margin: 0 auto;
            text-align: center;
        }

        /* Banner */
        .banner-reinos {
            border-radius: 20px;
            overflow: hidden;
            border: 3px solid var(--dourado-real);
            width: 85%;
            max-width: 280px;
            margin: 0 auto 15px;
            aspect-ratio: 16/10;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4), 0 0 20px rgba(212, 168, 67, 0.2);
            position: relative;
            background: linear-gradient(135deg, #2d1b4e, #1a0a2e);
        }
        
        .banner-reinos img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .banner-reinos::after {
            content: "👑";
            position: absolute;
            bottom: -15px;
            right: -10px;
            font-size: 35px;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
        }

        /* Títulos */
        .titulo-reinos {
            font-family: 'Cinzel Decorative', cursive;
            font-size: clamp(22px, 6vw, 30px);
            color: var(--dourado-real);
            text-shadow: 0 0 15px rgba(233, 30, 140, 0.5), 2px 2px 4px rgba(0,0,0,0.5);
            text-align: center;
            margin-bottom: 5px;
        }
        
        .subtitulo-magico {
            font-family: 'Dancing Script', cursive;
            font-size: clamp(14px, 4vw, 18px);
            color: rgba(255, 255, 255, 0.8);
            text-align: center;
            margin-bottom: 25px;
        }

        /* Container dos cards */
        .menu-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            width: 100%;
            max-width: 380px;
            margin: 0 auto;
        }

        /* Cards */
        .card-reino {
            padding: 22px 18px;
            border-radius: 20px;
            border: none;
            font-family: 'Cinzel Decorative', cursive;
            font-size: clamp(18px, 5vw, 22px);
            color: #fff;
            text-decoration: none;
            text-align: center;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            width: 100%;
            min-height: 130px;
        }
        
        .card-reino::before {
            content: "";
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .card-reino:hover::before { opacity: 1; }
        .card-reino:hover { transform: translateY(-6px) scale(1.02); }
        .card-reino:active { transform: scale(0.98); }

        /* Estilos específicos dos cards */
        .card-aprender {
            background: linear-gradient(145deg, #e91e8c, #9c1460);
            box-shadow: 0 8px 0 #7a0f4a, 0 0 20px rgba(233, 30, 140, 0.3);
            border: 2px solid rgba(255, 200, 220, 0.3);
        }
        .card-aprender:hover { box-shadow: 0 12px 0 #7a0f4a, 0 0 40px rgba(233, 30, 140, 0.5); }

        .card-palavrinhas {
            background: linear-gradient(145deg, #d4a843, #b8860b);
            box-shadow: 0 8px 0 #8b6914, 0 0 20px rgba(212, 168, 67, 0.3);
            border: 2px solid rgba(255, 240, 200, 0.3);
        }
        .card-palavrinhas:hover { box-shadow: 0 12px 0 #8b6914, 0 0 40px rgba(212, 168, 67, 0.5); }

        .emoji-reino {
            font-size: 42px;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
            transition: transform 0.3s;
        }
        
        .card-reino:hover .emoji-reino {
            transform: scale(1.15) rotate(-5deg);
        }
        
        .nome-reino {
            font-weight: 700;
            letter-spacing: 1px;
            font-size: clamp(16px, 4vw, 20px);
        }
        
        .desc-reino {
            font-family: 'Nunito', sans-serif;
            font-size: 12px;
            opacity: 0.9;
            font-weight: 600;
        }

        /* Decoração */
        .decoracao-castelo {
            margin-top: 20px;
            font-size: 18px;
            opacity: 0.4;
            letter-spacing: 8px;
            text-align: center;
        }

        /* Responsivo */
        @media (max-width: 480px) {
            .card-reino { padding: 18px 14px; min-height: 110px; }
            .emoji-reino { font-size: 34px; }
            .nome-reino { font-size: 16px; }
            .desc-reino { font-size: 10px; }
            .banner-reinos { max-width: 220px; }
            .btn-voltar-dourado { padding: 6px 15px; font-size: 12px; }
            .header-inner { padding: 10px 12px; }
        }
        
        @media (max-height: 600px) {
            .banner-reinos { max-width: 200px; margin-bottom: 8px; }
            .menu-container { gap: 12px; }
            .card-reino { padding: 14px 12px; min-height: 90px; }
            .emoji-reino { font-size: 30px; }
            .decoracao-castelo { margin-top: 10px; font-size: 14px; }
            .subtitulo-magico { margin-bottom: 15px; }
        }
    </style>
</head>
<body>

    <div id="coracoes-container"></div>

    <header class="header">
        <div class="header-inner">
            <a href="index.html" class="btn-voltar-dourado">← ✨ Voltar aos Reinos ✨</a>
            <div class="header-botoes">
                <button class="btn-fullscreen" id="btnFullscreen" title="Tela Cheia">⛶</button>
            </div>
        </div>
    </header>

    <div class="stage">
        <div class="conteudo-central">
            <div class="banner-reinos">
                <img src="ilha.jpg" alt="Reino das Vogais" onerror="this.style.display='none'; this.parentElement.style.background='linear-gradient(135deg, #e91e8c, #9c1460)'; this.parentElement.innerHTML += '<span style=\"font-size:48px;\">👸🤴</span>';">
            </div>
            
            <h1 class="titulo-reinos">🏰 Reino das Vogais</h1>
            <p class="subtitulo-magico">O reino das Princesas e Príncipes 👸🤴</p>
            
            <div class="menu-container">
                <!-- Botão Aprender as Vogais - link corrigido para vogais_maiusculas.html -->
                <a href="vogais_maiusculas.html" class="card-reino card-aprender">
                    <span class="emoji-reino">📚👑</span>
                    <span class="nome-reino">Aprender as Vogais</span>
                    <span class="desc-reino">Maiúsculas, minúsculas, forma e cursiva</span>
                </a>

                <!-- Botão Formando Palavrinhas -->
                <a href="palavras_com_vogais.html" class="card-reino card-palavrinhas">
                    <span class="emoji-reino">💃🕺</span>
                    <span class="nome-reino">Formando Palavrinhas</span>
                    <span class="desc-reino">AO - EI - UI - Descubra as palavras mágicas!</span>
                </a>
            </div>
            
            <div class="decoracao-castelo">👑 💖 🏰 💖 👑</div>
        </div>
    </div>

    <script>
        let somAtual = null;
        
        function tocarSom(arquivo) {
            if (!arquivo) return;
            try {
                if (somAtual) {
                    somAtual.pause();
                    somAtual.currentTime = 0;
                }
                somAtual = new Audio(arquivo);
                somAtual.play().catch(e => console.log('Áudio:', e));
            } catch(e) { console.log('Erro no áudio:', e); }
        }
        
        // Efeito sonoro ao passar o mouse nos cards
        function configurarEfeitosCards() {
            const cards = document.querySelectorAll('.card-reino');
            cards.forEach(card => {
                card.addEventListener('mouseenter', () => {
                    tocarSom('inicio.ogg');
                });
            });
        }
        
        // Fullscreen
        const FS_KEY = 'reinoFullscreen';
        
        function isFullscreen() {
            return !!(document.fullscreenElement || document.webkitFullscreenElement);
        }
        
        function enterFullscreen() {
            const elem = document.documentElement;
            if (elem.requestFullscreen) elem.requestFullscreen().catch(() => {});
            else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
        }
        
        function exitFullscreen() {
            if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
            else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
        }
        
        function toggleFullscreen() {
            if (isFullscreen()) {
                exitFullscreen();
                localStorage.setItem(FS_KEY, 'false');
            } else {
                enterFullscreen();
                localStorage.setItem(FS_KEY, 'true');
            }
            atualizarIconeFullscreen();
        }
        
        function atualizarIconeFullscreen() {
            const btn = document.getElementById('btnFullscreen');
            if (isFullscreen()) {
                btn.innerHTML = '✖';
                btn.classList.add('ativo');
            } else {
                btn.innerHTML = '⛶';
                btn.classList.remove('ativo');
            }
        }
        
        function setupFullscreenListeners() {
            const events = ['fullscreenchange', 'webkitfullscreenchange'];
            events.forEach(event => {
                document.addEventListener(event, () => {
                    atualizarIconeFullscreen();
                    if (!isFullscreen()) localStorage.setItem(FS_KEY, 'false');
                });
            });
        }
        
        function restaurarFullscreen() {
            const deveFullscreen = localStorage.getItem(FS_KEY) === 'true';
            if (deveFullscreen && !isFullscreen()) {
                setTimeout(() => enterFullscreen(), 100);
            }
            atualizarIconeFullscreen();
        }
        
        // Corações flutuantes
        function criarCoracoes() {
            const container = document.getElementById('coracoes-container');
            const simbolos = ['💖', '💕', '💗', '💝', '✨', '🌟', '👑'];
            const cores = ['#e91e8c', '#ff80c0', '#d4a843', '#ff4081'];
            
            function adicionarCoracao() {
                const c = document.createElement('div');
                c.className = 'coracao-flutuante';
                c.innerText = simbolos[Math.floor(Math.random() * simbolos.length)];
                c.style.left = Math.random() * 100 + '%';
                c.style.fontSize = (Math.random() * 14 + 12) + 'px';
                c.style.color = cores[Math.floor(Math.random() * cores.length)];
                c.style.animationDuration = (Math.random() * 6 + 5) + 's';
                container.appendChild(c);
                setTimeout(() => c.remove(), 11000);
            }
            
            for (let i = 0; i < 15; i++) {
                setTimeout(adicionarCoracao, i * 400);
            }
            setInterval(adicionarCoracao, 3000);
        }
        
        window.onload = function() {
            criarCoracoes();
            setupFullscreenListeners();
            restaurarFullscreen();
            configurarEfeitosCards();
            tocarSom('inicio.ogg');
        };
    </script>
</body>
</html>
