<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
    <title>Jornada das Letras: Vogais</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Nunito:wght@400;700;800&family=Fredoka+One&display=swap" rel="stylesheet">
    <style>
        :root {
            --coral: #f4845f; --coral-dark: #e05a3a;
            --turquoise: #4dd0e1; --turquoise-dark: #26a8b8;
            --lavender: #b39ddb; --lavender-dark: #8e79c0;
            --paper: #fefcf3; --brown: #5d4037;
            --ruled-line: #add8e6; --margin-line: #ff9999;
            --header-bg: rgba(254, 252, 243, 0.95);
        }

        [data-theme="dark"] {
            --paper: #2c3e50; --brown: #ecf0f1;
            --ruled-line: #34495e; --margin-line: #e74c3c;
            --header-bg: rgba(44, 62, 80, 0.95);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; transition: background 0.3s, color 0.3s; }

        body {
            font-family: 'Nunito', sans-serif;
            background: var(--paper);
            color: var(--brown);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Folha de Caderno */
        body::before {
            content: ''; position: fixed; inset: 0; z-index: 0;
            background: repeating-linear-gradient(0deg, transparent, transparent 30px, var(--ruled-line) 30px, var(--ruled-line) 31px);
            background-size: 100% 31px;
        }

        body::after {
            content: ''; position: fixed; top: 0; bottom: 0; left: clamp(40px, 8vw, 80px);
            width: 2px; background: var(--margin-line); opacity: 0.6;
        }

        .header { position: sticky; top: 0; z-index: 50; background: var(--header-bg); border-bottom: 2px solid var(--ruled-line); }
        .header-inner { max-width: 800px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; }
        
        .header-botoes { display: flex; gap: 10px; }
        .theme-toggle { background: var(--lavender); border: none; width: 45px; height: 45px; border-radius: 50%; cursor: pointer; font-size: 20px; box-shadow: 0 4px 0 var(--lavender-dark); display: flex; align-items: center; justify-content: center; }
        .btn-voltar { padding: 8px 16px; border-radius: 50px; border: none; font-weight: 800; background: #eee; color: #333; text-decoration: none; font-size: 13px; box-shadow: 0 3px 0 #bbb; }

        .stage { max-width: 700px; margin: 30px auto; padding: 0 16px; position: relative; z-index: 10; }
        .welcome { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 20px; }
        
        h2 { font-family: 'Patrick Hand', cursive; font-size: clamp(28px, 8vw, 36px); color: var(--brown); }

        .menu-container { display: flex; flex-direction: column; gap: 18px; width: 100%; max-width: 350px; }
        
        .btn-submenu {
            padding: 22px 15px; border-radius: 20px; border: none; 
            font-family: 'Fredoka One', cursive; font-size: 22px; color: #fff; 
            text-decoration: none; text-align: center;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex; flex-direction: column; align-items: center; gap: 5px;
            cursor: pointer;
        }
        .btn-submenu span { font-size: 16px; font-family: 'Nunito', sans-serif; opacity: 0.9; font-weight: 700; }
        .btn-submenu:hover { transform: scale(1.05); }
        .btn-submenu:active { transform: translateY(4px); }

        .btn-maiuscula { background: var(--coral); box-shadow: 0 6px 0 var(--coral-dark); }
        .btn-minuscula { background: var(--turquoise); box-shadow: 0 6px 0 var(--turquoise-dark); }
        .btn-palavrinhas { background: var(--lavender); box-shadow: 0 6px 0 var(--lavender-dark); }
    </style>
</head>
<body>

<header class="header">
    <div class="header-inner">
        <a href="index.html" class="btn-voltar">⬅ VOLTAR</a>
        <div class="header-botoes">
            <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" aria-label="Mudar para modo noite ou dia">☀️</button>
        </div>
    </div>
</header>

<div class="stage">
    <div class="welcome">
        <h2>Aventuras com as Vogais</h2>
        
        <div class="menu-container">
            <a href="vogais_maiusculas.html" class="btn-submenu btn-maiuscula" 
               onmouseenter="tocarAudio('vogais_maiuscula.mp3')">
                A E I O U
                <span>Vogais Maiúsculas</span>
            </a>

            <a href="vogais_minusculas.html" class="btn-submenu btn-minuscula" 
               onmouseenter="tocarAudio('vogais_minusculas.mp3')">
                a e i o u
                <span>Vogais Minúsculas</span>
            </a>

            <a href="palavras_com_vogais.html" class="btn-submenu btn-palavrinhas" 
               onmouseenter="tocarAudio('formando_palavrinhas.mp3')">
                AO - EI - UI
                <span>Formando Palavrinhas</span>
            </a>
        </div>
    </div>
</div>

<script>
    // Gerenciador de Áudio
    let somSubmenu;
    function tocarAudio(arquivo) {
        if (somSubmenu) {
            somSubmenu.pause();
            somSubmenu.currentTime = 0;
        }
        somSubmenu = new Audio(arquivo);
        somSubmenu.play().catch(e => console.log("Áudio aguardando interação."));
    }

    // Alternar Tema Noite/Dia
    function toggleTheme() {
        const body = document.body;
        const btn = document.getElementById('themeToggle');
        if (body.getAttribute('data-theme') === 'dark') {
            body.removeAttribute('data-theme');
            btn.innerHTML = '☀️';
        } else {
            body.setAttribute('data-theme', 'dark');
            btn.innerHTML = '🌙';
        }
    }
</script>

</body>
</html>
