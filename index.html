<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
    <title>Jornada das Letras: Menu Principal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Nunito:wght@400;600;700;800&family=Fredoka+One&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --coral: #f4845f; --coral-dark: #e05a3a;
            --turquoise: #4dd0e1; --turquoise-dark: #26a8b8;
            --lavender: #b39ddb; --lavender-dark: #8e79c0;
            --gold: #ffd54f; --gold-dark: #ffb300; 
            --paper: #fefcf3; --brown: #5d4037;
            --ruled-line: #add8e6; --margin-line: #ff9999;
        }

        [data-theme="dark"] {
            --paper: #1a1a2e; --brown: #ecf0f1;
            --ruled-line: rgba(255,255,255,0.05); --margin-line: #e74c3c;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Nunito', sans-serif;
            background: var(--paper);
            color: var(--brown);
            height: 100vh; height: 100dvh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: background 0.5s;
        }

        /* Linhas do caderno */
        body::before {
            content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
            background: repeating-linear-gradient(0deg, transparent, transparent 30px, var(--ruled-line) 30px, var(--ruled-line) 31px);
            background-size: 100% 31px;
        }

        .header { position: relative; z-index: 50; padding: 10px 16px; border-bottom: 2px solid var(--ruled-line); background: rgba(255,255,255,0.1); backdrop-filter: blur(5px); }
        .header-inner { max-width: 800px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
        
        .header-botoes { display: flex; gap: 8px; flex-wrap: wrap; }
        .theme-toggle, .btn-fullscreen { background: var(--lavender); border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; font-size: 18px; box-shadow: 0 3px 0 var(--lavender-dark); transition: 0.1s linear; }
        .btn-musica { padding: 6px 12px; border-radius: 50px; border: none; font-weight: 800; background: var(--turquoise); color: #004d40; box-shadow: 0 3px 0 var(--turquoise-dark); cursor: pointer; font-size: 12px; }
        .btn-fullscreen { background: var(--gold); box-shadow: 0 3px 0 var(--gold-dark); color: #5d4037; }

        .stage { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            padding: 10px; 
            z-index: 10;
            gap: 10px;
        }

        .welcome-banner { 
            border-radius: 20px; 
            overflow: hidden; 
            border: 4px solid #fff; 
            width: 80%; 
            max-width: 220px; 
            aspect-ratio: 4/3;
            box-shadow: 0 8px 15px rgba(0,0,0,0.1); 
        }
        .welcome-banner img { width: 100%; height: 100%; object-fit: cover; }

        .menu-container { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 12px; 
            width: 100%; 
            max-width: 400px; 
        }
        
        .btn-menu {
            padding: 15px 10px; 
            border-radius: 15px; 
            border: none; 
            font-family: 'Fredoka One', cursive;
            font-size: clamp(14px, 4vw, 18px); 
            color: #fff; 
            text-decoration: none; 
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, box-shadow 0.2s;
            line-height: 1.2;
        }
        .btn-menu:active { transform: scale(0.95); }

        .btn-vogais { background: var(--coral); box-shadow: 0 5px 0 var(--coral-dark); }
        .btn-alfabeto { background: var(--gold); box-shadow: 0 5px 0 var(--gold-dark); color: #5d4037; }
        .btn-consoantes { background: var(--turquoise); box-shadow: 0 5px 0 var(--turquoise-dark); }
        .btn-numeros { background: var(--lavender); box-shadow: 0 5px 0 var(--lavender-dark); }

        .emoji-btn { font-size: 24px; margin-bottom: 5px; }

        /* Aviso opcional de fullscreen */
        .fs-hint { 
            position: fixed; bottom: 10px; right: 10px; background: rgba(0,0,0,0.6); 
            color: white; padding: 5px 10px; border-radius: 20px; font-size: 11px; 
            font-family: monospace; z-index: 100; pointer-events: none;
            backdrop-filter: blur(4px);
        }
    </style>
</head>
<body>

<header class="header">
    <div class="header-inner">
        <div class="header-botoes">
            <button class="btn-musica" id="btnMusica" onclick="alternarMusica()">🎵 MÚSICA OFF</button>
            <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()">☀️</button>
            <button class="btn-fullscreen" id="fullscreenBtn" onclick="toggleFullscreen()">⛶</button>
        </div>
        <span style="font-family: 'Patrick Hand', cursive; font-size: 18px; font-weight: bold;">Olá, Giovanna! ✨</span>
    </div>
</header>

<div class="stage">
    <div class="welcome-banner">
        <img src="ilha.jpg" alt="Ilha do Conhecimento">
    </div>
    
    <h2 style="font-family: 'Patrick Hand', cursive; font-size: 24px;">Qual vamos jogar?</h2>
    
    <div class="menu-container">
        <a href="vogais.html" class="btn-menu btn-vogais" data-audio="vogais.mp3">
            <span class="emoji-btn">🅰️</span>
            Vogais
        </a>
        
        <a href="https://alfabeto-mu.vercel.app/" class="btn-menu btn-alfabeto" data-audio="alfabeto.mp3">
            <span class="emoji-btn">🔤</span>
            Alfabeto
        </a>
        
        <a href="consoantes.html" class="btn-menu btn-consoantes" data-audio="consoantes.mp3">
            <span class="emoji-btn">🅱️</span>
            Consoantes
        </a>

        <a href="numeros.html" class="btn-menu btn-numeros" data-audio="numeros.mp3">
            <span class="emoji-btn">🔢</span>
            Números
        </a>
    </div>
</div>

<div class="fs-hint">🔲 Clique em ⛶ para tela cheia</div>

<script>
    // 🎉 Chuva de alegria ao entrar!
    window.onload = function() {
        lancarFesta();
        // Verifica se a URL tem parâmetro "fullscreen=auto" (vindo de clique interno)
        autoFullscreenFromParam();
    };

    function lancarFesta() {
        confetti({
            particleCount: 100,
            spread: 70,
            origin: { y: 0.6 },
            colors: ['#f4845f', '#4dd0e1', '#b39ddb', '#ffd54f']
        });
    }

    // ----- FULLSCREEN COM PERSISTÊNCIA PARA LINKS INTERNOS -----
    function toggleFullscreen() {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(err => {
                console.warn(`Erro ao entrar em fullscreen: ${err.message}`);
            });
        } else {
            document.exitFullscreen();
        }
    }

    // Atualiza ícone do botão quando o estado fullscreen muda
    document.addEventListener('fullscreenchange', function() {
        const fsBtn = document.getElementById('fullscreenBtn');
        if (document.fullscreenElement) {
            fsBtn.innerHTML = '✖️';  // ícone de sair
            fsBtn.style.background = "#ffaaa5";
        } else {
            fsBtn.innerHTML = '⛶';
            fsBtn.style.background = "var(--gold)";
        }
    });

    // Função que força a página atual a entrar em fullscreen se veio de um clique especial
    function autoFullscreenFromParam() {
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('fullscreen') && urlParams.get('fullscreen') === 'auto') {
            // Remove o parâmetro da URL para não ficar sujo, mas só tenta fullscreen
            const cleanUrl = window.location.origin + window.location.pathname;
            window.history.replaceState({}, document.title, cleanUrl);
            
            // Pequeno delay para garantir que o DOM está pronto
            setTimeout(() => {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(e => {
                        console.log("Fullscreen automático bloqueado. Clique manualmente no botão ⛶");
                        // opcional: exibir um toasty?
                    });
                }
            }, 200);
        }
    }

    // ----- GERENCIADOR DE ÁUDIO (efeitos de clique) -----
    function tocarEfeito(arquivo) {
        if (!arquivo) return;
        const audio = new Audio(arquivo);
        audio.play().catch(() => {});
    }

    // Intercepta cliques nos links para adicionar flag fullscreen automático nos links INTERNOS
    // e também tocar o som definido em data-audio
    document.querySelectorAll('.btn-menu').forEach(link => {
        link.addEventListener('click', function(e) {
            const audioFile = this.getAttribute('data-audio');
            if (audioFile) tocarEfeito(audioFile);
            
            const href = this.getAttribute('href');
            if (!href || href === '#') return;
            
            // Verifica se é um link interno (próprio site) - não começa com http:// ou https://
            const isInternal = !href.startsWith('http://') && !href.startsWith('https://');
            
            // Se estiver em fullscreen E for link interno, adicionamos parâmetro para a próxima página abrir fullscreen
            if (document.fullscreenElement && isInternal) {
                e.preventDefault();  // segura o clique para modificar a URL
                
                let url = href;
                const separator = url.includes('?') ? '&' : '?';
                url += separator + 'fullscreen=auto';
                
                // Pequena magia: saímos do fullscreen atual suavemente e navegamos
                document.exitFullscreen().then(() => {
                    window.location.href = url;
                }).catch(() => {
                    // Se falhar ao sair, navega mesmo assim
                    window.location.href = url;
                });
            }
            // Para links externos, apenas permite a navegação normal (sem controle fullscreen)
        });
    });

    // ----- TEMA CLARO/ESCURO -----
    function toggleTheme() {
        const body = document.body;
        const btn = document.getElementById('themeToggle');
        
        if (body.getAttribute('data-theme') === 'dark') {
            body.removeAttribute('data-theme');
            btn.innerHTML = '☀️';
        } else {
            body.setAttribute('data-theme', 'dark');
            btn.innerHTML = '🌙';
            confetti({ particleCount: 30, spread: 50, origin: { y: 0.2 } });
        }
    }

    // ----- MÚSICA DE FUNDO -----
    const musicaFundo = new Audio('musica_fundo.ogg');
    musicaFundo.loop = true;
    musicaFundo.volume = 0.2;

    function alternarMusica() {
        const btn = document.getElementById('btnMusica');
        if (musicaFundo.paused) {
            musicaFundo.play();
            btn.innerHTML = `🎵 MÚSICA ON`;
            btn.style.background = "#fff";
        } else {
            musicaFundo.pause();
            btn.innerHTML = `🎵 MÚSICA OFF`;
            btn.style.background = "var(--turquoise)";
        }
    }

    // pequena dica no console sobre como ativar fullscreen automático nas outras páginas
    console.log("💡 Dica: Para as páginas internas (vogais.html, consoantes.html, numeros.html) também abrirem em tela cheia, cole o trecho abaixo no <head> ou antes do </body> delas:\n\n" +
    "// script para auto-fullscreen\n" +
    "if (new URLSearchParams(location.search).get('fullscreen') === 'auto') {\n" +
    "    document.documentElement.requestFullscreen();\n" +
    "    history.replaceState(null, '', location.pathname);\n" +
    "}\n");
</script>
</body>
</html>
