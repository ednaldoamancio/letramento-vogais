<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
    <title>Jornada das Letras: Menu Principal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Nunito:wght@400;600;700;800&family=Fredoka+One&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --coral: #f4845f; --coral-dark: #e05a3a;
            --turquoise: #4dd0e1; --turquoise-dark: #26a8b8;
            --lavender: #b39ddb; --lavender-dark: #8e79c0;
            --gold: #ffd54f; --gold-dark: #ffb300; 
            --paper: #fefcf3; --brown: #5d4037;
            --ruled-line: #add8e6; --margin-line: #ff9999;
        }

        [data-theme="dark"] {
            --paper: #1a1a2e; --brown: #ecf0f1;
            --ruled-line: rgba(255,255,255,0.05); --margin-line: #e74c3c;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Nunito', sans-serif;
            background: var(--paper);
            color: var(--brown);
            height: 100vh; height: 100dvh;
            overflow: hidden; /* Trava a rolagem */
            display: flex;
            flex-direction: column;
            transition: background 0.5s;
        }

        /* Linhas do caderno */
        body::before {
            content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
            background: repeating-linear-gradient(0deg, transparent, transparent 30px, var(--ruled-line) 30px, var(--ruled-line) 31px);
            background-size: 100% 31px;
        }

        .header { position: relative; z-index: 50; padding: 10px 16px; border-bottom: 2px solid var(--ruled-line); background: rgba(255,255,255,0.1); backdrop-filter: blur(5px); }
        .header-inner { max-width: 800px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; }
        
        .header-botoes { display: flex; gap: 8px; }
        .theme-toggle { background: var(--lavender); border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; font-size: 18px; box-shadow: 0 3px 0 var(--lavender-dark); }
        .btn-musica { padding: 6px 12px; border-radius: 50px; border: none; font-weight: 800; background: var(--turquoise); color: #004d40; box-shadow: 0 3px 0 var(--turquoise-dark); cursor: pointer; font-size: 12px; }

        .stage { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            padding: 10px; 
            z-index: 10;
            gap: 10px;
        }

        .welcome-banner { 
            border-radius: 20px; 
            overflow: hidden; 
            border: 4px solid #fff; 
            width: 80%; 
            max-width: 220px; 
            aspect-ratio: 4/3;
            box-shadow: 0 8px 15px rgba(0,0,0,0.1); 
        }
        .welcome-banner img { width: 100%; height: 100%; object-fit: cover; }

        .menu-container { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 12px; 
            width: 100%; 
            max-width: 400px; 
        }
        
        .btn-menu {
            padding: 15px 10px; 
            border-radius: 15px; 
            border: none; 
            font-family: 'Fredoka One', cursive;
            font-size: clamp(14px, 4vw, 18px); 
            color: #fff; 
            text-decoration: none; 
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, box-shadow 0.2s;
            line-height: 1.2;
        }
        .btn-menu:active { transform: scale(0.95); }

        .btn-vogais { background: var(--coral); box-shadow: 0 5px 0 var(--coral-dark); }
        .btn-alfabeto { background: var(--gold); box-shadow: 0 5px 0 var(--gold-dark); color: #5d4037; }
        .btn-consoantes { background: var(--turquoise); box-shadow: 0 5px 0 var(--turquoise-dark); }
        .btn-numeros { background: var(--lavender); box-shadow: 0 5px 0 var(--lavender-dark); }

        .emoji-btn { font-size: 24px; margin-bottom: 5px; }

    </style>
</head>
<body>

<header class="header">
    <div class="header-inner">
        <div class="header-botoes">
            <button class="btn-musica" id="btnMusica" onclick="alternarMusica()">🎵 MÚSICA OFF</button>
            <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()">☀️</button>
        </div>
        <span style="font-family: 'Patrick Hand', cursive; font-size: 18px; font-weight: bold;">Olá, Giovanna! ✨</span>
    </div>
</header>

<div class="stage">
    <div class="welcome-banner">
        <img src="ilha.jpg" alt="Ilha do Conhecimento">
    </div>
    
    <h2 style="font-family: 'Patrick Hand', cursive; font-size: 24px;">Qual vamos jogar?</h2>
    
    <div class="menu-container">
        <a href="vogais.html" class="btn-menu btn-vogais" onclick="tocarEfeito('vogais.mp3')">
            <span class="emoji-btn">🅰️</span>
            Vogais
        </a>
        
        <a href="https://alfabeto-mu.vercel.app/" class="btn-menu btn-alfabeto" onclick="tocarEfeito('alfabeto.mp3')">
            <span class="emoji-btn">🔤</span>
            Alfabeto
        </a>
        
        <a href="consoantes.html" class="btn-menu btn-consoantes" onclick="tocarEfeito('consoantes.mp3')">
            <span class="emoji-btn">🅱️</span>
            Consoantes
        </a>

        <a href="numeros.html" class="btn-menu btn-numeros" onclick="tocarEfeito('numeros.mp3')">
            <span class="emoji-btn">🔢</span>
            Números
        </a>
    </div>
</div>

<script>
    // 🎉 Chuva de alegria ao entrar!
    window.onload = function() {
        lancarFesta();
    };

    function lancarFesta() {
        confetti({
            particleCount: 100,
            spread: 70,
            origin: { y: 0.6 },
            colors: ['#f4845f', '#4dd0e1', '#b39ddb', '#ffd54f']
        });
    }

    // Gerenciador de Áudio
    function tocarEfeito(arquivo) {
        const audio = new Audio(arquivo);
        audio.play().catch(() => {});
    }

    // Alternar Tema 🌙☀️
    function toggleTheme() {
        const body = document.body;
        const btn = document.getElementById('themeToggle');
        
        if (body.getAttribute('data-theme') === 'dark') {
            body.removeAttribute('data-theme');
            btn.innerHTML = '☀️';
        } else {
            body.setAttribute('data-theme', 'dark');
            btn.innerHTML = '🌙';
            confetti({ particleCount: 30, spread: 50, origin: { y: 0.2 } });
        }
    }

    // Música de Fundo
    const musicaFundo = new Audio('musica_fundo.ogg');
    musicaFundo.loop = true;
    musicaFundo.volume = 0.2;

    function alternarMusica() {
        const btn = document.getElementById('btnMusica');
        if (musicaFundo.paused) {
            musicaFundo.play();
            btn.innerHTML = `🎵 MÚSICA ON`;
            btn.style.background = "#fff";
        } else {
            musicaFundo.pause();
            btn.innerHTML = `🎵 MÚSICA OFF`;
            btn.style.background = "var(--turquoise)";
        }
    }
</script>
</body>
</html>
