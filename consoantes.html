<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
    <title>🧚 Reino das Consoantes - Alfabetização Magica</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --verde-fada: #2d8e5f;
            --verde-escuro: #1a5c3a;
            --ouro-real: #d4a843;
            --branco-perola: #fff8f0;
            --roxo-magia: #6b2d8e;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #0f2b1d 0%, #1a5c3a 50%, #0f2b1d 100%);
            color: var(--branco-perola);
            height: 100vh; height: 100dvh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .header { padding: 10px 15px; background: rgba(15, 43, 29, 0.8); border-bottom: 2px solid var(--ouro-real); backdrop-filter: blur(5px); z-index: 10; display: flex; justify-content: space-between; align-items: center; }
        .btn-topo { padding: 8px 14px; border-radius: 50px; border: 2px solid var(--ouro-real); font-weight: 800; background: rgba(212, 168, 67, 0.2); color: var(--ouro-real); cursor: pointer; font-size: 13px; font-family: 'Nunito', sans-serif; transition: all 0.3s; text-decoration: none; }
        .btn-topo:hover { background: rgba(212, 168, 67, 0.4); transform: scale(1.05); }
        
        .stage { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px; z-index: 5; gap: 12px; }
        
        /* Área da Palavra e Imagem */
        .card-palavra { background: rgba(255, 248, 240, 0.95); border: 3px solid var(--ouro-real); border-radius: 20px; padding: 15px; width: 90%; max-width: 340px; display: flex; flex-direction: column; align-items: center; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        .wrapper-imagem { width: 140px; height: 140px; border-radius: 15px; overflow: hidden; border: 2px solid var(--verde-fada); margin-bottom: 12px; background: #fff; display: flex; align-items: center; justify-content: center; }
        .wrapper-imagem img { width: 100%; height: 100%; object-fit: contain; }
        
        /* Letras Ocultas */
        .container-letras { display: flex; gap: 8px; justify-content: center; margin-bottom: 5px; min-height: 55px; align-items: center; }
        .slot-letra { width: 45px; height: 45px; border-bottom: 4px solid var(--verde-escuro); font-size: 32px; font-weight: 900; text-align: center; color: #1a5c3a; display: flex; align-items: center; justify-content: center; text-transform: uppercase; }
        .slot-letra.oculta { color: transparent; border-bottom-color: var(--ouro-real); background: rgba(212, 168, 67, 0.1); border-radius: 5px 5px 0 0; }
        
        /* Teclado de Consoantes */
        .teclado { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; width: 100%; max-width: 400px; padding: 5px; }
        .tecla { background: linear-gradient(145deg, var(--ouro-real), #b8860b); border: 2px solid #fff; border-radius: 12px; font-size: 22px; font-weight: 900; color: #fff; padding: 10px 0; cursor: pointer; box-shadow: 0 4px 0 #8a6409; transition: all 0.1s; text-shadow: 1px 1px 2px rgba(0,0,0,0.3); }
        .tecla:active { transform: translateY(4px); box-shadow: none; }
        .tecla.errada { background: #b0b0b0; box-shadow: 0 4px 0 #707070; opacity: 0.6; pointer-events: none; }
        .tecla.certa { background: linear-gradient(145deg, #2d8e5f, #1a5c3a); box-shadow: 0 4px 0 #124529; pointer-events: none; }

        /* Controles de Navegação de Palavras */
        .controles-navegacao { display: flex; gap: 15px; width: 100%; max-width: 340px; justify-content: space-between; margin-top: 5px; }
        .btn-nav { flex: 1; padding: 10px; border: 2px solid var(--ouro-real); border-radius: 12px; font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 13px; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 5px; box-shadow: 0 4px 0 rgba(0,0,0,0.2); }
        .btn-anterior { background: #5d3a1a; color: var(--papel-pergaminho); color: #fff; }
        .btn-proxima { background: var(--roxo-magia); color: #fff; }
        .btn-nav:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,0.2); }
    </style>
</head>
<body>

    <header class="header">
        <!-- Alterado o comportamento para um fluxo direto via JS sem chamadas de clique nativo concorrentes -->
        <button class="btn-topo" id="btnVoltar">🏠 Tela Inicial</button>
        <div style="font-family: 'Cinzel Decorative', cursive; color: var(--ouro-real); font-size: 14px;">Fadas & Gnomos 🧚</div>
    </header>

    <div class="stage">
        <div class="card-palavra">
            <div class="wrapper-imagem">
                <img id="imagem-palavra" src="" alt="Figura do desafio">
            </div>
            <div class="container-letras" id="container-letras"></div>
        </div>

        <div class="teclado" id="teclado"></div>

        <!-- Novos botões de avançar e retroceder manual -->
        <div class="controles-navegacao">
            <button class="btn-nav btn-anterior" id="btnAnterior">⬅️ Anterior</button>
            <button class="btn-nav btn-proxima" id="btnProxima">Próxima ➡️</button>
        </div>
    </div>

    <script>
        // Banco de dados de palavras exemplo (substitua pelas suas imagens e termos)
        const palavras = [
            { termo: "FADA", imagem: "fada.jpg", consoantes: ["F", "D"] },
            { termo: "GATO", imagem: "gato.jpg", consoantes: ["G", "T"] },
            { termo: "CASA", imagem: "casa.jpg", consoantes: ["C", "S"] },
            { termo: "LUNA", imagem: "luna.jpg", consoantes: ["L", "N"] }
        ];

        let indiceAtual = 0;
        let letrasDescobertas = [];

        // REDIRECIONAMENTO IMEDIATO E PROFISSIONAL
        document.getElementById('btnVoltar').addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            window.location.href = "https://ilha-das-vogais.vercel.app/";
        });

        function iniciarDesafio() {
            const desafio = palavras[indiceAtual];
            const container = document.getElementById('container-letras');
            const imgElement = document.getElementById('imagem-palavra');
            
            container.innerHTML = '';
            letrasDescobertas = [];
            imgElement.src = desafio.imagem;

            // Cria os blocos ocultando apenas as consoantes
            for (let letra of desafio.termo.toUpperCase()) {
                const slot = document.createElement('div');
                slot.classList.add('slot-letra');
                
                if (desafio.consoantes.includes(letra)) {
                    slot.classList.add('oculta');
                    slot.dataset.letra = letra;
                    slot.innerText = letra;
                } else {
                    slot.innerText = letra; // Vogal fica visível
                }
                container.appendChild(slot);
            }
            criarTeclado();
        }

        function criarTeclado() {
            const tecladoContainer = document.getElementById('teclado');
            tecladoContainer.innerHTML = '';
            const listaConsoantes = ["B","C","D","F","G","H","J","K","L","M","N","P","Q","R","S","T","V","W","X","Y","Z"];

            listaConsoantes.forEach(letra => {
                const btn = document.createElement('button');
                btn.classList.add('tecla');
                btn.innerText = letra;
                btn.addEventListener('click', () => verificarLetra(letra, btn));
                tecladoContainer.appendChild(btn);
            });
        }

        function verificarLetra(letra, botao) {
            const desafio = palavras[indiceAtual];
            const slots = document.querySelectorAll('.slot-letra.oculta');
            let acertou = false;

            slots.forEach(slot => {
                if (slot.dataset.letra === letra) {
                    slot.classList.remove('oculta');
                    acertou = true;
                }
            });

            if (acertou) {
                botao.classList.add('certa');
                tocarSomSucesso();
                checarVitoria();
            } else {
                botao.classList.add('errada');
                tocarSomErro();
            }
        }

        function checarVitoria() {
            const slotsOcultos = document.querySelectorAll('.slot-letra.oculta');
            if (slotsOcultos.length === 0) {
                // Solta confetes reais da vitória
                confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
                
                // Avanço automático após 3 segundos
                setTimeout(() => {
                    proximaPalavra();
                }, 3000);
            }
        }

        function proximaPalavra() {
            indiceAtual = (indiceAtual + 1) % palavras.length;
            iniciarDesafio();
        }

        function palavraAnterior() {
            indiceAtual = (indiceAtual - 1 + palavras.length) % palavras.length;
            iniciarDesafio();
        }

        // Configuração dos novos botões manuais de avançar/retroceder
        document.getElementById('btnAnterior').addEventListener('click', (e) => {
            e.stopPropagation();
            palavraAnterior();
        });

        document.getElementById('btnProxima').addEventListener('click', (e) => {
            e.stopPropagation();
            proximaPalavra();
        });

        function tocarSomSucesso() { const a = new Audio('sucesso.mp3'); a.play().catch(()=>{}); }
        function tocarSomErro() { const a = new Audio('erro.mp3'); a.play().catch(()=>{}); }

        window.onload = iniciarDesafio;
    </script>
</body>
</html>
